<!-- FILE: zip/game.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VRealms — Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="vr-topbar">
    <button class="vr-icon-btn" id="btn-back" aria-label="Back">←</button>
    <div class="vr-topbar-title">
      <span id="universe-title">Universe</span>
      <small id="universe-tagline">Tagline</small>
    </div>

    <div class="vr-topbar-actions">
      <button class="vr-pill" id="btn-jetons" type="button">
        <span class="vr-pill-label" data-i18n="hdr.tokens">Jetons</span>
        <b id="hdr-jetons">0</b>
      </button>
      <button class="vr-pill" id="btn-vcoins" type="button">
        <span class="vr-pill-label" data-i18n="hdr.vcoins">VCoins</span>
        <b id="hdr-vcoins">0</b>
      </button>
      <button class="vr-icon-btn" id="btn-settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main class="vr-stage">
    <section class="vr-gauges" id="gauges"></section>

    <section class="vr-card-wrap">
      <article class="vr-card" id="card">
        <div class="vr-card-top">
          <div class="vr-card-meta">
            <span class="vr-reign" id="reign-label">Règne 1</span>
            <span class="vr-year" id="year-label">Année 1</span>
          </div>
        </div>

        <div class="vr-card-body">
          <h1 class="vr-card-title" id="card-title">Titre</h1>
          <p class="vr-card-text" id="card-body">Texte</p>
        </div>

        <div class="vr-card-choices">
          <button class="vr-choice-button" id="choice-left" type="button">
            <span id="choice-left-label">Choix gauche</span>
          </button>
          <button class="vr-choice-button" id="choice-right" type="button">
            <span id="choice-right-label">Choix droite</span>
          </button>
        </div>
      </article>

      <div class="vr-swipe-hint" id="swipe-hint" aria-hidden="true"></div>
    </section>

    <section class="vr-bottom">
      <button class="vr-btn" id="btn-universe" type="button" data-i18n="game.change_universe">Changer d’univers</button>
      <button class="vr-btn" id="btn-shop" type="button" data-i18n="game.shop">Boutique</button>
    </section>
  </main>

  <!-- Jetons popup -->
  <div class="vr-modal-backdrop" id="tokens-modal" aria-hidden="true">
    <div class="vr-modal">
      <h2 data-i18n="tokens.title">Jetons</h2>
      <p class="vr-muted" data-i18n="tokens.desc">Utilise un jeton pour relancer une run.</p>
      <div class="vr-modal-actions">
        <button class="vr-btn" id="btn-token-use" type="button" data-i18n="tokens.use">Utiliser 1 jeton</button>
        <button class="vr-btn" id="btn-token-ad" type="button" data-i18n="tokens.watch_ad">Regarder une pub (+1)</button>
      </div>
      <button class="vr-link" id="btn-token-close" type="button" data-i18n="common.close">Fermer</button>
    </div>
  </div>

  <!-- VCoins popup -->
  <div class="vr-modal-backdrop" id="coins-modal" aria-hidden="true">
    <div class="vr-modal">
      <h2 data-i18n="coins.title">VCoins</h2>
      <p class="vr-muted" data-i18n="coins.desc">Obtiens des VCoins pour acheter des univers.</p>
      <div class="vr-modal-actions">
        <button class="vr-btn" data-coins-action="coins_500" type="button" data-i18n="coins.watch_ad_500">Regarder une pub (+500)</button>
      </div>
      <button class="vr-link" id="btn-coins-close" type="button" data-i18n="common.close">Fermer</button>
    </div>
  </div>

  <!-- Fin -->
  <div class="vr-modal-backdrop" id="ending-overlay" aria-hidden="true">
    <div class="vr-modal vr-modal-wide">
      <h2 id="ending-title">Fin</h2>
      <p class="vr-muted" id="ending-body">…</p>
      <div class="vr-modal-actions">
        <button id="ending-restart-btn" class="vr-choice-button" type="button">
          <span data-i18n="game.restart">Recommencer</span>
        </button>

          <button id="ending-revive-btn" class="vr-choice-button" type="button">
            <span data-i18n="game.revive_ad">Revivre (pub)</span>
          </button>
      </div>
      <button class="vr-link" id="ending-close-btn" type="button" data-i18n="common.close">Fermer</button>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/userData.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
