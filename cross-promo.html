<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Vuniverse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    :root{
      --vr-bg: radial-gradient(circle at top, #f6e7cf 0, #1b6688 62%, #03279e 100%);
      --vr-overlay: none;
    }

    body.vr-crosspromo-body{
      min-height:100vh;
      background: var(--vr-bg);
    }

    .vr-crosspromo-shell{
      width:min(980px, calc(100vw - 24px));
      margin:0 auto;
      padding:14px 0 28px;
    }

    .vr-crosspromo-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }

    .vr-crosspromo-back{
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(0,0,0,.22);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      color:#fff;
      font-size:20px;
      box-shadow:0 10px 24px rgba(0,0,0,.24);
    }

    .vr-crosspromo-title-wrap{
      flex:1 1 auto;
      min-width:0;
      text-align:center;
    }

    .vr-crosspromo-title{
      margin:0;
      color:#fff;
      font-size:22px;
      font-weight:900;
      text-shadow:0 8px 20px rgba(0,0,0,.32);
    }

    .vr-crosspromo-subtitle{
      margin:6px 0 0;
      color:rgba(255,255,255,.9);
      font-size:13px;
      line-height:1.35;
    }

    .vr-crosspromo-spacer{
      width:44px;
      height:44px;
      flex:0 0 44px;
    }

    .vr-crosspromo-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
    }

    .vr-crosspromo-card{
      position:relative;
      overflow:hidden;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(10,16,28,.28);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:0 16px 40px rgba(0,0,0,.28);
    }

    .vr-crosspromo-hero{
      position:relative;
      min-height:150px;
      padding:18px 16px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0)),
        radial-gradient(circle at top right, rgba(255,255,255,.16), transparent 45%),
        rgba(0,0,0,.08);
    }

    .vr-crosspromo-hero img{
      width:min(58%, 260px);
      max-width:100%;
      max-height:100px;
      height:auto;
      min-height:0;
      object-fit:contain;
      display:block;
      margin:0 auto;
    }

    .vr-crosspromo-badge{
      position:absolute;
      top:12px;
      left:12px;
      z-index:2;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.34);
      color:#fff;
      font-size:12px;
      font-weight:900;
      letter-spacing:.2px;
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
    }

    .vr-crosspromo-content{
      padding:14px;
      color:#fff;
    }

    .vr-crosspromo-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .vr-crosspromo-name{
      margin:0;
      font-size:22px;
      line-height:1.05;
      font-weight:950;
      color:#fff;
    }

    .vr-crosspromo-reward{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
      flex-wrap:wrap;
      text-align:center;
    }

    .vr-crosspromo-reward-label{
      font-size:11px;
      font-weight:900;
      letter-spacing:.2px;
      opacity:.95;
    }

    .vr-crosspromo-reward img{
      width:18px;
      height:18px;
      object-fit:contain;
      display:block;
      flex:0 0 18px;
    }

    .vr-crosspromo-reward-value{
      font-size:13px;
      font-weight:950;
    }

    .vr-crosspromo-desc{
      margin:0 auto 14px auto;
      color:rgba(255,255,255,.92);
      font-size:14px;
      line-height:1.45;
      text-align:center;
      max-width:34ch;
    }

    /* 3 IMAGES PAR APP */
    .vr-crosspromo-gallery{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:10px;
      margin-bottom:12px;
      justify-items:center;
      align-items:start;
    }

    .vr-crosspromo-shot{
      width:100%;
      max-width:110px;
      aspect-ratio: 9 / 16;
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
    }

    .vr-crosspromo-shot img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .vr-crosspromo-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .vr-crosspromo-btn{
      min-height:50px;
      padding:12px 14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.10);
      color:#fff;
      font-weight:900;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .vr-crosspromo-btn.primary{
      background:rgba(122,167,255,.24);
      border-color:rgba(122,167,255,.36);
    }

    .vr-crosspromo-btn:active{
      transform:scale(.99);
    }

    @media (min-width: 860px){
      .vr-crosspromo-grid{
        grid-template-columns:1fr 1fr;
      }

      .vr-crosspromo-shot{
        max-width:120px;
      }
    }

    @media (max-width: 520px){
      .vr-crosspromo-shell{
        width:min(100vw - 18px, 980px);
        padding:10px 0 22px;
      }

      .vr-crosspromo-title{
        font-size:20px;
      }

      .vr-crosspromo-name{
        font-size:20px;
      }

      .vr-crosspromo-hero{
        min-height:126px;
        padding:16px 14px 10px;
      }

      .vr-crosspromo-hero img{
        width:min(54%, 210px);
        max-height:84px;
      }

      .vr-crosspromo-shot{
        max-width:96px;
      }

      .vr-crosspromo-actions{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body class="vr-body vr-crosspromo-body">
  <main class="vr-crosspromo-shell">

    <div class="vr-crosspromo-top">
      <a
        class="vr-crosspromo-back"
        href="index.html"
        aria-label=""
        data-i18n-aria="ui.aria_back"
      >←</a>

      <div class="vr-crosspromo-title-wrap">
        <h1 class="vr-crosspromo-title" data-i18n="crosspromo.page_title"></h1>
        <p class="vr-crosspromo-subtitle" data-i18n="crosspromo.page_subtitle"></p>
      </div>

      <div class="vr-crosspromo-spacer" aria-hidden="true"></div>
    </div>

    <section class="vr-crosspromo-grid" id="vr-crosspromo-grid"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseBootstrap.js"></script>
  <script src="js/userData.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/purchases.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/crossPromo.js"></script>
</body>
</html>
