<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    :root{
      --vr-bg: radial-gradient(circle at top, #f6e7cf 0, #1b6688 62%, #03279e 100%);
      --vr-overlay: none;
    }

    /* ✅ (TON CSS) rendu plus "studio" du sélecteur langues avec drapeaux (gardé) */
    .vr-lang-row{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .vr-lang-select{
      width:100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: #fff;
      font-size: 14px;
      outline:none;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
    }
    .vr-lang-preview{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
    }
    .vr-flag{
      font-size: 20px;
      line-height: 1;
      width: 24px;
      text-align:center;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.45));
    }
    .vr-lang-name{
      font-weight: 900;
      letter-spacing: .2px;
    }
    .vr-lang-code{
      margin-left:auto;
      opacity:.85;
      font-weight:800;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      padding: 6px 10px;
      border-radius: 999px;
    }
    .vr-hint{
      font-size: 12px;
      opacity: .85;
      line-height: 1.3;
    }

    /* ==========================
       AJOUTS (topbar + grille + pubs + help)
       ========================== */

    body.vr-body.page-settings{
      overflow-x:hidden;
    }

    /* ✅ Topbar compact : home/back + profil */
    .vr-header{
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .vr-top-actions{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
    }
    .vr-top-slot{
      flex:1 1 0;
      display:flex;
      align-items:center;
    }
    .vr-top-left{ justify-content:flex-start; }
    .vr-top-center{ justify-content:center; }
    .vr-top-right{ justify-content:flex-end; }

    .vr-icon-button{
      width:44px;
      height:44px;
      border-radius:999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.26);
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      -webkit-tap-highlight-color: transparent;
    }
    .vr-icon-button:active{ transform: scale(.98); }

    .vr-icon-button img{
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
      pointer-events:none;
      user-select:none;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65)) contrast(1.15) brightness(1.08);
    }
    .vr-back-ico{
      width:24px;
      height:24px;
      display:block;
      opacity:.98;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65));
    }

    /* ✅ Contenu : un peu de marges safe-area */
    .vr-main{
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }

    /* ✅ Grille drapeaux (sans dropdown) */
    .vr-langGrid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:10px;
      margin-top: 14px;
      margin-bottom: 18px;
    }
    @media (min-width: 520px){
      .vr-langGrid{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .vr-langBtn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 6px;
      border-radius: 14px;
      border: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      color: inherit;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      text-align:center;
    }
    .vr-langBtn:active{ transform: scale(.98); }
    .vr-langBtn.isActive{
      outline: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,.22), 0 14px 34px rgba(0,0,0,.26) !important;
      background: transparent !important;
      border: 0 !important;
    }

    .vr-flagBox{
      width: 46px;
      height: 32px;
      border-radius: 8px;
      overflow:hidden;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
    }
    .vr-flagBox svg{ width:100%; height:100%; display:block; }

    /* ✅ Sections */
    .vr-settingsSection{
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.10);
    }
    .vr-settingsSectionTitle{
      font-weight: 950;
      font-size: 13px;
      letter-spacing: .2px;
      opacity: .92;
      margin: 0 0 10px 0;
    }

    /* ✅ Toggle pubs (sans carré) */
    .vr-toggleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 8px 0;
      border:0;
      background:transparent;
    }
    .vr-toggleText{ min-width:0; }
    .vr-toggleLabel{
      font-weight: 950;
      line-height: 1.2;
      margin:0;
    }
    .vr-toggleDesc{
      margin:6px 0 0 0;
      opacity: .78;
      font-size: 12px;
      line-height: 1.25;
    }

    .vr-switch{
      position: relative;
      width: 54px;
      height: 32px;
      flex: 0 0 auto;
    }
    .vr-switch input{
      position:absolute;
      inset:0;
      opacity:0;
      width:100%;
      height:100%;
      margin:0;
      cursor:pointer;
    }
    .vr-switchUi{
      position:absolute;
      inset:0;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      transition: .18s ease;
    }
    .vr-switchUi::after{
      content:"";
      position:absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 10px 18px rgba(0,0,0,.22);
      transition: .18s ease;
    }
    .vr-switch input:checked + .vr-switchUi{
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,59,59,.12) inset;
    }
    .vr-switch input:checked + .vr-switchUi::after{
      transform: translateX(22px);
    }

    /* ✅ Help centré (sans carré) */
    .vr-helpLine{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 8px 0;
      border:0;
      background:transparent;
      margin-top:10px;
      overflow:hidden;
      text-align:center;
    }
    .vr-helpLabel{ font-weight: 950; opacity:.92; }
    .vr-helpMail{
      opacity:.86;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 100%;
    }

    /* ✅ message */
    #settingsMsg{
      margin-top:10px;
      min-height: 18px;
    }
  </style>
</head>

<body class="vr-body page-settings">

  <!-- ✅ Topbar : home/back + profil -->
  <header class="vr-header" aria-label="Top actions">
    <div class="vr-top-actions">
      <div class="vr-top-slot vr-top-left">
        <a id="btnBackHome" class="vr-icon-button" href="index.html" aria-label="">
          <svg class="vr-back-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="white" d="M15.5 5.5a1 1 0 0 1 0 1.4L10.4 12l5.1 5.1a1 1 0 1 1-1.4 1.4l-5.8-5.8a1.2 1.2 0 0 1 0-1.4l5.8-5.8a1 1 0 0 1 1.4 0z"/>
          </svg>
        </a>
      </div>

      <div class="vr-top-slot vr-top-center"></div>

      <div class="vr-top-slot vr-top-right">
        <a id="btnGoProfile" class="vr-icon-button" href="profile.html" aria-label="">
          <img src="assets/img/ui/btn_profile.webp" alt="" draggable="false" />
        </a>
      </div>
    </div>
  </header>

  <div class="vr-overlay"></div>

  <main class="vr-main">
    <section id="view-settings" class="vr-view vr-view-active">
      <h2 class="vr-section-title" data-i18n="settings.title"></h2>

      <div class="vr-profile-grid">
        <div class="vr-profile-card">

          <div id="settingsLangGrid" class="vr-langGrid" aria-label=""></div>

          <!-- ✅ PUBS -->
          <div class="vr-settingsSection">
            <div id="settingsAdsTitle" class="vr-settingsSectionTitle"></div>

            <div class="vr-toggleRow">
              <div class="vr-toggleText">
                <p id="adsLabel" class="vr-toggleLabel"></p>
                <p id="adsDesc" class="vr-toggleDesc"></p>
              </div>

              <label id="adsSwitch" class="vr-switch" aria-label="">
                <input id="adsPersonalized" type="checkbox" />
                <span class="vr-switchUi"></span>
              </label>
            </div>
          </div>

          <!-- ✅ AIDE -->
          <div class="vr-settingsSection">
            <div id="settingsHelpTitle" class="vr-settingsSectionTitle" style="text-align:center;"></div>

            <div class="vr-helpLine">
              <span id="helpEmailLabel" class="vr-helpLabel"></span>
              <span id="helpEmailValue" class="vr-helpMail"></span>
            </div>
          </div>

          <div id="settingsMsg" class="vr-hint" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ✅ IMPORTANT : Supabase + bootstrap + userData avant i18n / UI -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
