<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* ✅ (TON CSS) rendu plus "studio" du sélecteur langues avec drapeaux (gardé) */
    .vr-lang-row{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .vr-lang-select{
      width:100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: #fff;
      font-size: 14px;
      outline:none;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
    }
    .vr-lang-preview{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
    }
    .vr-flag{
      font-size: 20px;
      line-height: 1;
      width: 24px;
      text-align:center;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.45));
    }
    .vr-lang-name{
      font-weight: 900;
      letter-spacing: .2px;
    }
    .vr-lang-code{
      margin-left:auto;
      opacity:.85;
      font-weight:800;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      padding: 6px 10px;
      border-radius: 999px;
    }
    .vr-hint{
      font-size: 12px;
      opacity: .85;
      line-height: 1.3;
    }

    /* ==========================
       AJOUTS (topbar + grille + pubs + help)
       ========================== */

    body.vr-body.page-settings{
      overflow-x:hidden;
    }

    /* ✅ Topbar compact : home/back + profil */
    .vr-header{
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .vr-top-actions{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
    }
    .vr-top-slot{
      flex:1 1 0;
      display:flex;
      align-items:center;
    }
    .vr-top-left{ justify-content:flex-start; }
    .vr-top-center{ justify-content:center; }
    .vr-top-right{ justify-content:flex-end; }

    .vr-icon-button{
      width:44px;
      height:44px;
      border-radius:999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.26);
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      -webkit-tap-highlight-color: transparent;
    }
    .vr-icon-button:active{ transform: scale(.98); }

    .vr-icon-button img{
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
      pointer-events:none;
      user-select:none;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65)) contrast(1.15) brightness(1.08);
    }
    .vr-back-ico{
      width:24px;
      height:24px;
      display:block;
      opacity:.98;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65));
    }

    /* ✅ Contenu : un peu de marges safe-area */
    .vr-main{
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }

    /* ✅ Grille drapeaux (sans dropdown) */
    .vr-langGrid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:10px;
      margin-top: 14px;
      margin-bottom: 18px;
    }
    @media (min-width: 520px){
      .vr-langGrid{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .vr-langBtn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 6px;
      border-radius: 14px;
      border: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      color: inherit;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      text-align:center;
    }
    .vr-langBtn:active{ transform: scale(.98); }
    .vr-langBtn.isActive{
      outline: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,.22), 0 14px 34px rgba(0,0,0,.26) !important;
      background: transparent !important;
      border: 0 !important;
    }

    .vr-flagBox{
      width: 46px;
      height: 32px;
      border-radius: 8px;
      overflow:hidden;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
    }
    .vr-flagBox svg{ width:100%; height:100%; display:block; }

    /* ✅ Sections */
    .vr-settingsSection{
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.10);
    }
    .vr-settingsSectionTitle{
      font-weight: 950;
      font-size: 13px;
      letter-spacing: .2px;
      opacity: .92;
      margin: 0 0 10px 0;
    }

    /* ✅ Toggle pubs (sans carré) */
    .vr-toggleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 8px 0;
      border:0;
      background:transparent;
    }
    .vr-toggleText{ min-width:0; }
    .vr-toggleLabel{
      font-weight: 950;
      line-height: 1.2;
      margin:0;
    }
    .vr-toggleDesc{
      margin:6px 0 0 0;
      opacity: .78;
      font-size: 12px;
      line-height: 1.25;
    }

    .vr-switch{
      position: relative;
      width: 54px;
      height: 32px;
      flex: 0 0 auto;
    }
    .vr-switch input{
      position:absolute;
      inset:0;
      opacity:0;
      width:100%;
      height:100%;
      margin:0;
      cursor:pointer;
    }
    .vr-switchUi{
      position:absolute;
      inset:0;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      transition: .18s ease;
    }
    .vr-switchUi::after{
      content:"";
      position:absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 10px 18px rgba(0,0,0,.22);
      transition: .18s ease;
    }
    .vr-switch input:checked + .vr-switchUi{
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18), 0 0 0 1px rgba(255,59,59,.12) inset;
    }
    .vr-switch input:checked + .vr-switchUi::after{
      transform: translateX(22px);
    }

    /* ✅ Help centré (sans carré) */
    .vr-helpLine{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 8px 0;
      border:0;
      background:transparent;
      margin-top:10px;
      overflow:hidden;
      text-align:center;
    }
    .vr-helpLabel{ font-weight: 950; opacity:.92; }
    .vr-helpMail{
      opacity:.86;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 100%;
    }

    /* ✅ message */
    #settingsMsg{
      margin-top:10px;
      min-height: 18px;
    }
  </style>
</head>

<body class="vr-body page-settings">

  <!-- ✅ Topbar : home/back + profil -->
  <header class="vr-header" aria-label="Top actions">
    <div class="vr-top-actions">
      <div class="vr-top-slot vr-top-left">
        <a id="btnBackHome" class="vr-icon-button" href="index.html" aria-label="">
          <svg class="vr-back-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="white" d="M15.5 5.5a1 1 0 0 1 0 1.4L10.4 12l5.1 5.1a1 1 0 1 1-1.4 1.4l-5.8-5.8a1.2 1.2 0 0 1 0-1.4l5.8-5.8a1 1 0 0 1 1.4 0z"/>
          </svg>
        </a>
      </div>

      <div class="vr-top-slot vr-top-center"></div>

      <div class="vr-top-slot vr-top-right">
        <a id="btnGoProfile" class="vr-icon-button" href="profile.html" aria-label="">
          <img src="assets/img/ui/btn_profile.webp" alt="" draggable="false" />
        </a>
      </div>
    </div>
  </header>

  <div class="vr-overlay"></div>

  <main class="vr-main">
    <section id="view-settings" class="vr-view vr-view-active">
      <h2 class="vr-section-title" data-i18n="settings.title"></h2>

      <div class="vr-profile-grid">
        <div class="vr-profile-card">
          <label class="vr-label" data-i18n="settings.language"></label>

          <!-- ✅ grille drapeaux (sans dropdown) -->
          <div id="settingsLangGrid" class="vr-langGrid" aria-label=""></div>

          <div class="vr-hint" data-i18n="settings.language_hint"></div>

          <!-- ✅ PUBS -->
          <div class="vr-settingsSection">
            <div id="settingsAdsTitle" class="vr-settingsSectionTitle"></div>

            <div class="vr-toggleRow">
              <div class="vr-toggleText">
                <p id="adsLabel" class="vr-toggleLabel"></p>
                <p id="adsDesc" class="vr-toggleDesc"></p>
              </div>

              <label id="adsSwitch" class="vr-switch" aria-label="">
                <input id="adsPersonalized" type="checkbox" />
                <span class="vr-switchUi"></span>
              </label>
            </div>
          </div>

          <!-- ✅ AIDE -->
          <div class="vr-settingsSection">
            <div id="settingsHelpTitle" class="vr-settingsSectionTitle" style="text-align:center;"></div>

            <div class="vr-helpLine">
              <span id="helpEmailLabel" class="vr-helpLabel"></span>
              <span id="helpEmailValue" class="vr-helpMail"></span>
            </div>
          </div>

          <div id="settingsMsg" class="vr-hint" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ✅ IMPORTANT : Supabase + bootstrap + userData avant i18n / UI -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseBootstrap.js"></script>
  <script src="js/userData.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/i18n.js"></script>

  <script>
  (async () => {
    const LangStorageKey = "vchoice_lang";
    const LangLegacyKey1 = "VREALMS_LANG";
    const LangLegacyKey2 = "vrealms_lang";
    const AdsPrefKey = "vchoice_ads_personalized"; // "1" / "0"

    const LANGS = [
      { code:"en",   ui:"EN",   nameKey:"ui.lang_name.en"  },
      { code:"fr",   ui:"FR",   nameKey:"ui.lang_name.fr"  },
      { code:"de",   ui:"DE",   nameKey:"ui.lang_name.de"  },
      { code:"es",   ui:"ES",   nameKey:"ui.lang_name.es"  },
      { code:"pt",   ui:"PT",   nameKey:"ui.lang_name.pt"  },
      { code:"ptbr", ui:"PTBR", nameKey:"ui.lang_name.ptbr"},
      { code:"it",   ui:"IT",   nameKey:"ui.lang_name.it"  },
      { code:"ko",   ui:"KO",   nameKey:"ui.lang_name.ko"  },
      { code:"ja",   ui:"JP",   nameKey:"ui.lang_name.ja"  },
      { code:"id",   ui:"ID",   nameKey:"ui.lang_name.id"  }
    ];

    function $(id){ return document.getElementById(id); }
    function safeLower(x){ return String(x||"").trim().toLowerCase(); }

    function normalizeLang(raw){
      if(!raw) return null;
      const s = safeLower(raw);
      const map = {
        "pt-br":"ptbr","pt_br":"ptbr",
        "pt-pt":"pt","pt_pt":"pt",
        "jp":"ja","ja-jp":"ja",
        "kr":"ko","ko-kr":"ko",
        "in":"id","id-id":"id"
      };
      if(map[s]) return map[s];
      const base = s.split(/[-_]/)[0];
      if(base === "pt" && (s.includes("br") || s.includes("ptbr"))) return "ptbr";
      if(base === "ja") return "ja";
      if(base === "ko") return "ko";
      if(base === "in") return "id";
      return base || null;
    }

    function supported(code){
      const c = normalizeLang(code);
      return LANGS.some(x => x.code === c);
    }

    function getStoredLang(){
      try{
        const a = normalizeLang(localStorage.getItem(LangStorageKey));
        if(a && supported(a)) return a;
      }catch(_){}
      try{
        const b = normalizeLang(localStorage.getItem(LangLegacyKey1));
        if(b && supported(b)) return b;
      }catch(_){}
      try{
        const c = normalizeLang(localStorage.getItem(LangLegacyKey2));
        if(c && supported(c)) return c;
      }catch(_){}
      // userData (cache) si dispo
      try{
        const d = normalizeLang(window.VUserData?.getLang?.());
        if(d && supported(d)) return d;
      }catch(_){}
      return null;
    }

    function detectDeviceLang(){
      const list = Array.isArray(navigator.languages) && navigator.languages.length
        ? navigator.languages
        : [navigator.language];
      for(const cand of list){
        const base = normalizeLang(cand);
        if(base && supported(base)) return base;
      }
      return "en";
    }

    // i18n helper: essaie plusieurs clés (settings.* puis ui.*)
    function tAny(keys, fallback){
      const arr = Array.isArray(keys) ? keys : [keys];
      try{
        if(window.VRI18n && typeof window.VRI18n.t === "function"){
          for(const k of arr){
            const v = window.VRI18n.t(k);
            // si ton i18n renvoie la clé brute quand absent, on filtre
            if(v && v !== k) return v;
          }
        }
      }catch(_){}
      return (fallback ?? "");
    }

    // ====== SVG flags ======
    const FLAGS = {
      fr: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" x="0" y="0" fill="#1f4fbf"/><rect width="10" height="20" x="10" y="0" fill="#ffffff"/><rect width="10" height="20" x="20" y="0" fill="#d11f2e"/></svg>`,
      en: `<svg viewBox="0 0 30 20" aria-hidden="true">
  <rect width="30" height="20" fill="#fff"/>
  <g fill="#b22234">
    <rect y="0" width="30" height="1.538"/>
    <rect y="3.076" width="30" height="1.538"/>
    <rect y="6.152" width="30" height="1.538"/>
    <rect y="9.228" width="30" height="1.538"/>
    <rect y="12.304" width="30" height="1.538"/>
    <rect y="15.38" width="30" height="1.538"/>
    <rect y="18.456" width="30" height="1.544"/>
  </g>
  <rect width="12.6" height="10.77" fill="#3c3b6e"/>
  <g fill="#fff" opacity="0.95">
    <circle cx="1.8" cy="1.6" r=".35"/><circle cx="3.6" cy="1.6" r=".35"/><circle cx="5.4" cy="1.6" r=".35"/><circle cx="7.2" cy="1.6" r=".35"/><circle cx="9.0" cy="1.6" r=".35"/><circle cx="10.8" cy="1.6" r=".35"/>
    <circle cx="2.7" cy="2.8" r=".35"/><circle cx="4.5" cy="2.8" r=".35"/><circle cx="6.3" cy="2.8" r=".35"/><circle cx="8.1" cy="2.8" r=".35"/><circle cx="9.9" cy="2.8" r=".35"/>
    <circle cx="1.8" cy="4.0" r=".35"/><circle cx="3.6" cy="4.0" r=".35"/><circle cx="5.4" cy="4.0" r=".35"/><circle cx="7.2" cy="4.0" r=".35"/><circle cx="9.0" cy="4.0" r=".35"/><circle cx="10.8" cy="4.0" r=".35"/>
    <circle cx="2.7" cy="5.2" r=".35"/><circle cx="4.5" cy="5.2" r=".35"/><circle cx="6.3" cy="5.2" r=".35"/><circle cx="8.1" cy="5.2" r=".35"/><circle cx="9.9" cy="5.2" r=".35"/>
    <circle cx="1.8" cy="6.4" r=".35"/><circle cx="3.6" cy="6.4" r=".35"/><circle cx="5.4" cy="6.4" r=".35"/><circle cx="7.2" cy="6.4" r=".35"/><circle cx="9.0" cy="6.4" r=".35"/><circle cx="10.8" cy="6.4" r=".35"/>
    <circle cx="2.7" cy="7.6" r=".35"/><circle cx="4.5" cy="7.6" r=".35"/><circle cx="6.3" cy="7.6" r=".35"/><circle cx="8.1" cy="7.6" r=".35"/><circle cx="9.9" cy="7.6" r=".35"/>
    <circle cx="1.8" cy="8.8" r=".35"/><circle cx="3.6" cy="8.8" r=".35"/><circle cx="5.4" cy="8.8" r=".35"/><circle cx="7.2" cy="8.8" r=".35"/><circle cx="9.0" cy="8.8" r=".35"/><circle cx="10.8" cy="8.8" r=".35"/>
  </g>
</svg>`,
      de: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="6.67" y="0" fill="#111"/><rect width="30" height="6.67" y="6.67" fill="#d11f2e"/><rect width="30" height="6.66" y="13.34" fill="#f4c300"/></svg>`,
      es: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="5" y="0" fill="#c8102e"/><rect width="30" height="10" y="5" fill="#f4c300"/><rect width="30" height="5" y="15" fill="#c8102e"/></svg>`,
      pt: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="12" height="20" x="0" y="0" fill="#1a7f3b"/><rect width="18" height="20" x="12" y="0" fill="#c8102e"/><circle cx="12" cy="10" r="4.5" fill="#f4c300" opacity="0.95"/></svg>`,
      ptbr:`<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#1a7f3b"/><path d="M15 3 L26 10 L15 17 L4 10 Z" fill="#f4c300"/><circle cx="15" cy="10" r="4" fill="#1f4fbf"/></svg>`,
      it: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="10" height="20" x="0" y="0" fill="#1a7f3b"/><rect width="10" height="20" x="10" y="0" fill="#ffffff"/><rect width="10" height="20" x="20" y="0" fill="#c8102e"/></svg>`,
      ko: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#ffffff"/><circle cx="15" cy="10" r="5" fill="#c8102e"/><path d="M15 5a5 5 0 0 0 0 10a2.5 2.5 0 0 1 0-5a2.5 2.5 0 0 0 0-5Z" fill="#0a3a87" opacity="0.95"/></svg>`,
      ja: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#ffffff"/><circle cx="15" cy="10" r="5" fill="#d11f2e"/></svg>`,
      id: `<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="10" y="0" fill="#d11f2e"/><rect width="30" height="10" y="10" fill="#ffffff"/></svg>`
    };

    function renderTexts(){
      // Titre + desc (on tente settings.* puis ui.*)
      const title = tAny(["settings.title","ui.settings_title"], "");
      document.title = title || document.title || "";

      // aria topbar
      const back = $("btnBackHome");
      const prof = $("btnGoProfile");
      if(back) back.setAttribute("aria-label", tAny(["settings.back_home_aria","ui.settings_back_home_aria"], ""));
      if(prof) prof.setAttribute("aria-label", tAny(["settings.open_profile_aria","ui.settings_open_profile_aria"], ""));

      // grid aria
      const grid = $("settingsLangGrid");
      if(grid) grid.setAttribute("aria-label", tAny(["settings.language","ui.language"], ""));

      // Ads texts
      const adsTitle = $("settingsAdsTitle");
      const adsLabel = $("adsLabel");
      const adsDesc  = $("adsDesc");
      const adsSw    = $("adsSwitch");
      if(adsTitle) adsTitle.textContent = tAny(["settings.ads_title","ui.settings_ads_title"], "");
      if(adsLabel) adsLabel.textContent = tAny(["settings.ads_personalized_label","ui.settings_ads_personalized_label"], "");
      if(adsDesc)  adsDesc.textContent  = tAny(["settings.ads_personalized_desc","ui.settings_ads_personalized_desc"], "");
      if(adsSw)    adsSw.setAttribute("aria-label", tAny(["settings.ads_personalized_label","ui.settings_ads_personalized_label"], ""));

      // Help texts
      const helpTitle = $("settingsHelpTitle");
      const helpLab   = $("helpEmailLabel");
      const helpVal   = $("helpEmailValue");
      if(helpTitle) helpTitle.textContent = tAny(["settings.help_title","ui.settings_help_title"], "");
      if(helpLab)   helpLab.textContent   = tAny(["settings.help_email_label","ui.settings_help_email_label"], "");
      if(helpVal)   helpVal.textContent   = tAny(["settings.help_email","ui.settings_help_email"], "help.vboldstudio@gmail.com");
    }

    function buildGrid(active){
      const grid = $("settingsLangGrid");
      if(!grid) return;

      grid.innerHTML = "";
      for(const L of LANGS){
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "vr-langBtn" + ((active === L.code) ? " isActive" : "");
        btn.setAttribute("data-lang", L.code);

        const flag = document.createElement("div");
        flag.className = "vr-flagBox";
        flag.innerHTML = FLAGS[L.code] || FLAGS.en;

        btn.appendChild(flag);

        const ariaTpl = tAny(["settings.choose_lang_aria","ui.settings_choose_lang_aria"], "");
        const aria = (ariaTpl || "").replace("{code}", L.ui);
        if(aria) btn.setAttribute("aria-label", aria);

        btn.addEventListener("click", () => setLanguage(L.code, { showMsg:true }));
        grid.appendChild(btn);
      }
    }

    function markActive(code){
      document.querySelectorAll(".vr-langBtn[data-lang]").forEach((b) => {
        b.classList.toggle("isActive", b.getAttribute("data-lang") === code);
      });
    }

    async function setLanguage(raw, opts = {}){
      const code = normalizeLang(raw) || "en";
      const safe = supported(code) ? code : "en";

      // local first
      try{ localStorage.setItem(LangStorageKey, safe); }catch(_){}
      try{ localStorage.setItem(LangLegacyKey1, safe); }catch(_){}
      try{ localStorage.setItem(LangLegacyKey2, safe); }catch(_){}

      // update cache local VUserData (soft)
      try{
        if(window.VUserData && typeof window.VUserData.save === "function"){
          window.VUserData.save({ lang: safe }, { silent:true });
        }
      }catch(_){}

      // remote
      let remoteOk = true;
      try{
        if(window.VUserData && typeof window.VUserData.setLang === "function"){
          remoteOk = !!(await window.VUserData.setLang(safe));
        }
      }catch(_){ remoteOk = false; }

      // i18n apply
      try{
        if(window.VRI18n && typeof window.VRI18n.initI18n === "function"){
          await window.VRI18n.initI18n(safe);
        }
      }catch(_){}

      renderTexts();
      buildGrid(safe);
      markActive(safe);

      const msg = $("settingsMsg");
      if(msg && opts.showMsg){
        msg.textContent = remoteOk
          ? tAny(["settings.msg_saved","ui.settings_msg_saved"], "")
          : tAny(["settings.msg_saved_local","ui.settings_msg_saved_local"], "");
      }
      return safe;
    }

    // ====== PUBS PERSONNALISÉES ======
    function getAdsPref(){
      try{
        const v = localStorage.getItem(AdsPrefKey);
        if(v === "1") return true;
        if(v === "0") return false;
      }catch(_){}
      return false; // défaut OFF
    }

    async function setAdsPref(value, { showMsg } = {}){
      const on = !!value;
      try{ localStorage.setItem(AdsPrefKey, on ? "1" : "0"); }catch(_){}

      // push au module ads.js (natif si dispo)
      try{ window.VAds?.setPersonalized?.(on); }catch(_){}

      const box = $("adsPersonalized");
      if(box) box.checked = on;

      const msg = $("settingsMsg");
      if(msg && showMsg){
        msg.textContent = tAny(["settings.ads_saved","ui.settings_ads_saved"], "");
      }
    }

    // ====== BOOT ======
    try { await window.bootstrapAuthAndProfile?.(); } catch(e) {}
    try { await window.VUserData?.init?.(); } catch(e) {}

    // decide initial lang (server/cache > local > device)
    let initial = getStoredLang() || detectDeviceLang();

    // ensure local lang exists
    try{
      if(!getStoredLang()){
        localStorage.setItem(LangStorageKey, initial);
        localStorage.setItem(LangLegacyKey1, initial);
        localStorage.setItem(LangLegacyKey2, initial);
      }
    }catch(_){}

    // init i18n with initial lang
    try { await window.VRI18n?.initI18n?.(initial); } catch(e) {}

    renderTexts();
    buildGrid(supported(initial) ? initial : "en");
    await setLanguage(initial, { showMsg:false });

    // init ads pref
    const adsBox = $("adsPersonalized");
    if(adsBox){
      adsBox.checked = getAdsPref();
      adsBox.addEventListener("change", () => setAdsPref(adsBox.checked, { showMsg:true }));
    }
    try{ window.VAds?.setPersonalized?.(getAdsPref()); }catch(_){}
  })();
  </script>
</body>
</html>
