<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title></title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* =========================
       VRealms Shop — style calqué sur la pièce jointe
       (mêmes volumes, mêmes ombres, même rendu pro)
    ========================= */

    :root{
      --vr-bg0:#05060a;
      --vr-bg1:#090b13;
      --vr-bg2:#0b1226;

      --vr-accent:#ff3b3b;
      --vr-accent2:#b71b1b;

      --vr-card-r:20px;
      --vr-border:rgba(255,255,255,.10);
      --vr-border2:rgba(255,255,255,.14);

      --vr-text:rgba(255,255,255,.94);
      --vr-muted:rgba(255,255,255,.68);

      --vr-glow: 0 18px 40px rgba(0,0,0,.45);
      --vr-soft: 0 10px 24px rgba(0,0,0,.25);
    }

    html.shop-modal-open, body.shop-modal-open{
      overflow:hidden;
      touch-action:none;
    }

    body.vr-body{
      background:
        radial-gradient(1200px 700px at 50% -120px, rgba(255,59,59,.16), transparent 60%),
        radial-gradient(900px 600px at 80% 15%, rgba(110,40,190,.10), transparent 55%),
        radial-gradient(1000px 700px at 20% 45%, rgba(18,110,140,.10), transparent 60%),
        linear-gradient(180deg, var(--vr-bg0), var(--vr-bg1) 45%, var(--vr-bg2));
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
      margin:0;
      color: var(--vr-text);
    }

    body.vr-body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      opacity:.08;
      background-image:url("assets/img/ui/noise.png");
      background-size:260px 260px;
      mix-blend-mode:overlay;
    }

    body.vr-body::after{
      content:"";
      position:fixed;
      inset:-60px;
      pointer-events:none;
      z-index:0;
      background: radial-gradient(circle at 50% 40%, transparent 0 42%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.78) 100%);
    }

    .vr-top-actions{
      position:relative;
      z-index:10;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
    }
    .vr-top-slot{ flex:1 1 0; display:flex; align-items:center; }
    .vr-top-left{ justify-content:flex-start; }
    .vr-top-center{ justify-content:center; }
    .vr-top-right{ justify-content:flex-end; }

    /* bouton rond */
    .vr-icon-button{
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.26);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: var(--vr-soft);
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
    }
    .vr-icon-button:active{ transform:scale(.98); }

    /* page container */
    .vr-page{
      position:relative;
      z-index:1;
      padding: 12px 14px 26px;
    }

    .shop-head{
      padding: 6px 2px 12px;
      text-align:center;
    }
    .shop-title{
      margin: 4px 0 0;
      font-size: 20px;
      font-weight: 950;
      letter-spacing: .2px;
      color: var(--vr-text);
      text-shadow: 0 10px 28px rgba(0,0,0,.55);
      min-height: 24px;
    }

    /* ===== Top rewarded offers (2 cards) ===== */
    .reward-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 10px 0 14px;
    }
    @media (max-width: 360px){ .reward-grid{ gap:10px; } }

    .shop-panel{
      border-radius: var(--vr-card-r);
      border: 1px solid var(--vr-border);
      background: rgba(0,0,0,0.22);
      box-shadow: var(--vr-glow);
      overflow:hidden;
      position: relative;
    }

    .reward-card{
      padding: 12px 12px 12px;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
    }
    .reward-card::before{
      content:"";
      position:absolute;
      inset:-1px;
      pointer-events:none;
      background:
        radial-gradient(420px 180px at 20% 15%, rgba(255,59,59,.18), transparent 60%),
        radial-gradient(420px 220px at 75% 20%, rgba(110,40,190,.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 40%);
      opacity:.9;
    }

    .reward-top{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
      min-height: 74px;
    }

    .reward-ico{
      width:72px;
      height:72px;
      object-fit:contain;
      filter: drop-shadow(0 16px 30px rgba(0,0,0,.55));
      flex:0 0 auto;
      user-select:none;
      pointer-events:none;
    }

    .reward-x{
      font-weight: 950;
      font-size: 20px;
      letter-spacing: .2px;
      color: var(--vr-text);
      opacity: .98;
      text-shadow: 0 10px 22px rgba(0,0,0,.45);
      line-height: 1;
      text-align:right;
      min-height: 22px;
    }

    .reward-btn{
      position:relative;
      width:100%;
      border-radius: 14px;
      padding: 11px 10px;
      font-weight: 950;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.28);
      color: var(--vr-text);
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,.22);
      min-height: 42px;
    }
    .reward-btn:active{ transform: translateY(1px); }
    .reward-btn.is-busy{ opacity:.7; cursor:not-allowed; }

    /* ===== Divider ===== */
    .shop-divider{
      margin: 26px 2px 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      opacity: .95;
    }
    .shop-divider-line{
      height:1px;
      flex: 1 1 auto;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
    }
    .shop-divider-title{
      margin:0;
      font-size:13px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      color: rgba(255,255,255,.78);
      text-shadow: 0 10px 22px rgba(0,0,0,.55);
      white-space:nowrap;
      min-height:16px;
    }

    /* ===== Universe section ===== */
    .uni-card{
      padding: 14px 14px 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .uni-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .uni-title{
      margin:0;
      font-size:16px;
      font-weight:950;
      letter-spacing:.2px;
      color: var(--vr-text);
      text-shadow: 0 10px 22px rgba(0,0,0,.45);
      min-height:18px;
    }
    .uni-desc{
      margin: 6px 0 0;
      color: var(--vr-muted);
      font-size: 13px;
      line-height: 1.35;
      min-height:18px;
    }

    .vr-universe-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .vr-card{
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      overflow:hidden;
      background: rgba(0,0,0,.18);
      position:relative;
      cursor:pointer;
      padding:0;
      text-align:left;
      box-shadow: 0 14px 28px rgba(0,0,0,.22);
      -webkit-tap-highlight-color: transparent;
      min-height: 132px;
    }
    .vr-card:active{ transform: scale(.99); }

    .vr-card-bg{
      position:absolute;
      inset:0;
      background-size: cover;
      background-position:center;
      filter: saturate(1.02) contrast(1.04);
    }
    .vr-card-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.72));
    }

    .vr-card-content{
      position:relative;
      z-index:1;
      padding: 10px 10px 10px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      height:100%;
      justify-content:flex-end;
    }

    .vr-card-header-line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }

    .vr-card-title{
      margin:0;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .2px;
      color: rgba(255,255,255,.95);
      text-shadow: 0 10px 22px rgba(0,0,0,.55);
      line-height:1.15;
      min-height: 16px;
    }

    .vr-info-btn{
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.25);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight: 950;
      font-size: 12px;
      color: rgba(255,255,255,.92);
      user-select:none;
      flex: 0 0 auto;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
    }

    .vr-universe-badge{
      margin-top: 2px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .02em;
      background: rgba(0,0,0,.30);
      border: 1px solid rgba(255,255,255,.14);
      width: fit-content;
      max-width: 100%;
      user-select:none;
      min-height: 24px;
    }
    .vr-universe-badge.locked{ background: rgba(0,0,0,.40); }
    .vr-universe-badge.unlocked{ background: rgba(0,0,0,.25); }

    .vr-card.vr-card-locked{ opacity:.65; }

    /* ===== Modal ===== */
    .shop-modal{
      position: fixed;
      inset: 0;
      z-index: 999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px 14px;
      background: rgba(0,0,0,.62);
      opacity: 0;
      pointer-events:none;
      transition: opacity .14s ease;
    }
    .shop-modal.is-open{
      opacity: 1;
      pointer-events:auto;
    }

    .shop-modal-card{
      width: min(520px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(900px 420px at 20% 0%, rgba(255,59,59,.16), transparent 60%),
        radial-gradient(900px 420px at 90% 5%, rgba(110,40,190,.12), transparent 60%),
        rgba(8,10,16,.92);
      box-shadow: 0 26px 70px rgba(0,0,0,.70);
      overflow:hidden;
      transform: scale(.98) translateY(6px);
      transition: transform .16s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .shop-modal.is-open .shop-modal-card{
      transform: scale(1) translateY(0);
    }

    .shop-modal-top{
      padding: 18px 16px 10px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      align-items:center;
      text-align:center;
    }

    .shop-modal-ico{
      width: 86px;
      height: 86px;
      object-fit: contain;
      filter: drop-shadow(0 18px 34px rgba(0,0,0,.60));
      flex: 0 0 auto;
      user-select:none;
      pointer-events:none;
    }

    .shop-modal-title{
      margin: 0;
      font-size: 20px;
      font-weight: 950;
      color: var(--vr-text);
      line-height: 1.1;
      text-shadow: 0 10px 24px rgba(0,0,0,.55);
      min-height: 22px;
    }

    .shop-modal-price{
      font-weight: 950;
      font-size: 20px;
      letter-spacing: .2px;
      color: var(--vr-text);
      white-space: nowrap;
      margin-top: 2px;
      min-height: 22px;
      text-align:center;
    }

    .shop-modal-desc{
      margin: 8px 16px 0;
      color: var(--vr-muted);
      font-size: 13px;
      line-height: 1.35;
      text-align:center;
      min-height: 18px;
    }

    .shop-modal-bottom{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 12px;
      padding: 14px 16px 16px;
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
    }

    .shop-modal-actions{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:center;
      width:100%;
    }

    .shop-modal-btn{
      border-radius: 14px;
      padding: 11px 14px;
      font-weight: 950;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: var(--vr-text);
      cursor:pointer;
      min-width: 132px;
      min-height: 44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }
    .shop-modal-btn:active{ transform: translateY(1px); }

    .shop-modal-btn.primary{
      border-color: rgba(255,59,59,.30);
      background: linear-gradient(180deg, rgba(255,59,59,.20), rgba(0,0,0,.16));
      box-shadow: 0 14px 30px rgba(0,0,0,.30);
    }
    .shop-modal-btn[disabled]{ opacity:.6; cursor:not-allowed; }

    /* petits labels */
    .shop-status{
      margin: 10px 2px 0;
      color: var(--vr-muted);
      font-size: 13px;
      line-height: 1.35;
      min-height: 18px;
      text-align:center;
    }
  </style>
</head>

<body class="vr-body" data-page="shop">

  <!-- Top actions (3 icônes comme ton VRealms) -->
  <header class="vr-header" aria-label="" data-i18n-aria="shop.aria_top_actions">
    <div class="vr-top-actions">
      <div class="vr-top-slot vr-top-left">
        <button class="vr-icon-button" type="button" id="btn-profile" aria-label="" data-i18n-aria="shop.aria_profile">
          <span class="vr-icon-image vr-icon-profile" aria-hidden="true"></span>
        </button>
      </div>

      <div class="vr-top-slot vr-top-center"></div>

      <div class="vr-top-slot vr-top-right">
        <button class="vr-icon-button" type="button" id="btn-settings" aria-label="" data-i18n-aria="shop.aria_settings">
          <span class="vr-icon-image vr-icon-settings" aria-hidden="true"></span>
        </button>
        <button class="vr-icon-button" type="button" id="btn-shop" aria-label="" data-i18n-aria="shop.aria_shop" aria-current="page">
          <span class="vr-icon-image vr-icon-shop" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="vr-page">
    <header class="shop-head">
      <h1 class="shop-title" data-i18n="shop.title"></h1>
    </header>

    <!-- ✅ Rewarded (mêmes 2 cartes que la pièce jointe) -->
    <section class="reward-grid" aria-label="" data-i18n-aria="shop.aria_rewarded">
      <div class="shop-panel reward-card">
        <div class="reward-top">
          <img class="reward-ico" src="assets/img/ui/jeton.webp" alt="" draggable="false" />
          <div class="reward-x" data-i18n="shop.reward_jeton_x1"></div>
        </div>
        <button class="reward-btn" id="btn-reward-jeton" type="button" data-i18n="shop.reward_btn_jeton"></button>
      </div>

      <div class="shop-panel reward-card">
        <div class="reward-top">
          <img class="reward-ico" src="assets/img/ui/vcoin.webp" alt="" draggable="false" />
          <div class="reward-x" data-i18n="shop.reward_vcoins_x300"></div>
        </div>
        <button class="reward-btn" id="btn-reward-coins" type="button" data-i18n="shop.reward_btn_vcoins"></button>
      </div>
    </section>

    <p class="shop-status" id="shop-status"></p>

    <!-- ✅ Séparateur -->
    <div class="shop-divider">
      <div class="shop-divider-line"></div>
      <h2 class="shop-divider-title" data-i18n="shop.section_universes"></h2>
      <div class="shop-divider-line"></div>
    </div>

    <!-- ✅ Univers (cards identiques à ton index) -->
    <section class="shop-panel uni-card" aria-label="" data-i18n-aria="shop.aria_universes">
      <div class="uni-head">
        <div>
          <h3 class="uni-title" data-i18n="shop.universe_title"></h3>
          <p class="uni-desc" data-i18n="shop.universe_desc"></p>
        </div>
      </div>

      <div class="vr-universe-grid" id="shop-universe-grid">

        <button class="vr-card" data-universe="hell_king" type="button">
          <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/hell_king.webp');"></div>
          <div class="vr-card-content">
            <div class="vr-card-header-line">
              <h3 class="vr-card-title" data-i18n="universe.hell_king.title"></h3>
              <span class="vr-info-btn" role="button" tabindex="0" data-i18n="ui.info_symbol" data-i18n-tip="universe.hell_king.desc"></span>
            </div>
            <!-- badge injecté par JS -->
          </div>
        </button>

        <button class="vr-card" data-universe="heaven_king" type="button">
          <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/heaven_king.webp');"></div>
          <div class="vr-card-content">
            <div class="vr-card-header-line">
              <h3 class="vr-card-title" data-i18n="universe.heaven_king.title"></h3>
              <span class="vr-info-btn" role="button" tabindex="0" data-i18n="ui.info_symbol" data-i18n-tip="universe.heaven_king.desc"></span>
            </div>
          </div>
        </button>

        <button class="vr-card" data-universe="western_president" type="button">
          <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/western_president.webp');"></div>
          <div class="vr-card-content">
            <div class="vr-card-header-line">
              <h3 class="vr-card-title" data-i18n="universe.western_president.title"></h3>
              <span class="vr-info-btn" role="button" tabindex="0" data-i18n="ui.info_symbol" data-i18n-tip="universe.western_president.desc"></span>
            </div>
          </div>
        </button>

        <button class="vr-card" data-universe="mega_corp_ceo" type="button">
          <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/mega_corp_ceo.webp');"></div>
          <div class="vr-card-content">
            <div class="vr-card-header-line">
              <h3 class="vr-card-title" data-i18n="universe.mega_corp_ceo.title"></h3>
              <span class="vr-info-btn" role="button" tabindex="0" data-i18n="ui.info_symbol" data-i18n-tip="universe.mega_corp_ceo.desc"></span>
            </div>
          </div>
        </button>

        <button class="vr-card" data-universe="new_world_explorer" type="button">
          <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/new_world_explorer.webp');"></div>
          <div class="vr-card-content">
            <div class="vr-card-header-line">
              <h3 class="vr-card-title" data-i18n="universe.new_world_explorer.title"></h3>
              <span class="vr-info-btn" role="button" tabindex="0" data-i18n="ui.info_symbol" data-i18n-tip="universe.new_world_explorer.desc"></span>
            </div>
          </div>
        </button>

        <button class="vr-card" data-universe="vampire_lord" type="button">
          <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/vampire_lord.webp');"></div>
          <div class="vr-card-content">
            <div class="vr-card-header-line">
              <h3 class="vr-card-title" data-i18n="universe.vampire_lord.title"></h3>
              <span class="vr-info-btn" role="button" tabindex="0" data-i18n="ui.info_symbol" data-i18n-tip="universe.vampire_lord.desc"></span>
            </div>
          </div>
        </button>
      </div>

      <p class="shop-status" id="shop-universe-status"></p>
    </section>
  </main>

  <!-- ✅ Modal univers (unlock VCoins) -->
  <div class="shop-modal" id="universeModal" aria-hidden="true">
    <div class="shop-modal-card" role="dialog" aria-modal="true" aria-label="" data-i18n-aria="shop.aria_universe_modal">
      <div class="shop-modal-top">
        <img class="shop-modal-ico" id="universeModalIcon" src="assets/img/ui/vcoin.webp" alt="" draggable="false" />
        <h2 class="shop-modal-title" id="universeModalTitle"></h2>
        <div class="shop-modal-price" id="universeModalPrice"></div>
      </div>

      <p class="shop-modal-desc" id="universeModalDesc"></p>

      <div class="shop-modal-bottom">
        <div class="shop-modal-actions">
          <button class="shop-modal-btn" id="universeModalCancel" type="button" data-i18n="shop.modal_cancel"></button>
          <button class="shop-modal-btn primary" id="universeModalBuy" type="button" data-universe-buy="" data-i18n="shop.modal_buy"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseBootstrap.js"></script>

  <!-- helper bootstrap déjà présent dans ton shop -->
  <script>
    (function () {
      async function ensureBootstrap() {
        if (window.__vr_bootstrap_ready) return;
        try {
          if (typeof window.bootstrapAuthAndProfile === "function") {
            await window.bootstrapAuthAndProfile();
          }
        } catch (_) {}
        window.__vr_bootstrap_ready = true;
      }

      ensureBootstrap();

      window.vrWaitBootstrap = async function () {
        if (window.__vr_bootstrap_ready) return true;
        var t0 = Date.now();
        while (!window.__vr_bootstrap_ready && (Date.now() - t0) < 3000) {
          await new Promise(function (r) { setTimeout(r, 50); });
        }
        return !!window.__vr_bootstrap_ready;
      };
    })();
  </script>

  <script src="js/userData.js"></script>
