<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>VRealms - Boutique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    :root{
      --vr-bg: radial-gradient(circle at top, #f6e7cf 0, #1b6688 62%, #03279e 100%);
      --vr-overlay: none;
    }

    .vr-universe-badge{
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      background: rgba(0,0,0,.30);
      border: 1px solid rgba(255,255,255,.14);
      width: fit-content;
      max-width: 100%;
      user-select: none;
    }
    .vr-universe-badge.locked{ background: rgba(0,0,0,.40); }
    .vr-universe-badge.unlocked{ background: rgba(0,0,0,.25); }
    .vr-card.vr-card-locked{ opacity:.65; }
  </style>
</head>

<body class="vr-body">
  <header class="vr-header" aria-label="Top actions">
    <div class="vr-top-actions">
      <button class="vr-icon-button" type="button" id="btn-profile" aria-label="Profile">
        <span class="vr-icon-image vr-icon-profile"></span>
      </button>
      <button class="vr-icon-button" type="button" id="btn-settings" aria-label="Settings">
        <span class="vr-icon-image vr-icon-settings"></span>
      </button>
      <button class="vr-icon-button" type="button" id="btn-shop" aria-label="Shop">
        <span class="vr-icon-image vr-icon-shop"></span>
      </button>
    </div>
  </header>

  <div class="vr-overlay"></div>

  <main class="vr-main">
    <section id="view-shop" class="vr-view vr-view-active">
      <h2 class="vr-section-title" data-i18n="shop.title"></h2>

      <div class="vr-profile-grid">

        <!-- ✅ NOUVEAU : Univers à débloquer (mêmes cartes que l'index) -->
        <div class="vr-profile-card">
          <h3 class="vr-profile-title">Univers</h3>
          <p class="vr-profile-text" style="opacity:.85">Débloque de nouveaux univers avec tes VCoins (300 VCoins / univers).</p>

          <div class="vr-universe-grid" id="shop-universe-grid">
            <button class="vr-card" data-universe="hell_king" type="button">
              <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/hell_king.webp');"></div>
              <div class="vr-card-content">
                <div class="vr-card-header-line">
                  <h3 class="vr-card-title" data-i18n="universe.hell_king.title"></h3>
                  <span class="vr-info-btn" role="button" tabindex="0" data-i18n-tip="universe.hell_king.desc">?</span>
                </div>
              </div>
            </button>

            <button class="vr-card" data-universe="heaven_king" type="button">
              <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/heaven_king.webp');"></div>
              <div class="vr-card-content">
                <div class="vr-card-header-line">
                  <h3 class="vr-card-title" data-i18n="universe.heaven_king.title"></h3>
                  <span class="vr-info-btn" role="button" tabindex="0" data-i18n-tip="universe.heaven_king.desc">?</span>
                </div>
              </div>
            </button>

            <button class="vr-card" data-universe="western_president" type="button">
              <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/western_president.webp');"></div>
              <div class="vr-card-content">
                <div class="vr-card-header-line">
                  <h3 class="vr-card-title" data-i18n="universe.western_president.title"></h3>
                  <span class="vr-info-btn" role="button" tabindex="0" data-i18n-tip="universe.western_president.desc">?</span>
                </div>
              </div>
            </button>

            <button class="vr-card" data-universe="mega_corp_ceo" type="button">
              <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/mega_corp_ceo.webp');"></div>
              <div class="vr-card-content">
                <div class="vr-card-header-line">
                  <h3 class="vr-card-title" data-i18n="universe.mega_corp_ceo.title"></h3>
                  <span class="vr-info-btn" role="button" tabindex="0" data-i18n-tip="universe.mega_corp_ceo.desc">?</span>
                </div>
              </div>
            </button>

            <button class="vr-card" data-universe="new_world_explorer" type="button">
              <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/new_world_explorer.webp');"></div>
              <div class="vr-card-content">
                <div class="vr-card-header-line">
                  <h3 class="vr-card-title" data-i18n="universe.new_world_explorer.title"></h3>
                  <span class="vr-info-btn" role="button" tabindex="0" data-i18n-tip="universe.new_world_explorer.desc">?</span>
                </div>
              </div>
            </button>

            <button class="vr-card" data-universe="vampire_lord" type="button">
              <div class="vr-card-bg" style="background-image:url('assets/img/ui/universes/vampire_lord.webp');"></div>
              <div class="vr-card-content">
                <div class="vr-card-header-line">
                  <h3 class="vr-card-title" data-i18n="universe.vampire_lord.title"></h3>
                  <span class="vr-info-btn" role="button" tabindex="0" data-i18n-tip="universe.vampire_lord.desc">?</span>
                </div>
              </div>
            </button>
          </div>

          <p class="vr-profile-text" id="shop-universe-status" style="opacity:.85;margin-top:10px;"></p>
        </div>

        <!-- Rewarded (laissé intact, géré par purchases.js) -->
        <div class="vr-profile-card">
          <h3 class="vr-profile-title" data-i18n="shop.reward_title"></h3>
          <p class="vr-profile-text" data-i18n="shop.reward_desc"></p>

          <button class="vr-choice-button" id="btn-reward-jeton" type="button">
            <span data-i18n="shop.get_1_jeton"></span>
          </button>

          <button class="vr-choice-button" id="btn-reward-coins" type="button">
            <span data-i18n="shop.get_300_coins"></span>
          </button>

          <p class="vr-profile-text" id="shop-status" style="opacity:.85;margin-top:10px;"></p>
        </div>

        <!-- No Ads -->
        <div class="vr-profile-card">
          <h3 class="vr-profile-title" data-i18n="shop.noads_title"></h3>
          <p class="vr-profile-text" data-i18n="shop.noads_desc"></p>

          <button class="vr-choice-button" id="btn-buy-noads" type="button">
            <span data-i18n="shop.noads_buy"></span>
          </button>

          <p class="vr-profile-text" id="noads-status" style="opacity:.85;margin-top:10px;"></p>
        </div>

      </div>
    </section>
  </main>

  <!-- ✅ Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseBootstrap.js"></script>

  <!-- helper bootstrap déjà présent dans ton shop -->
  <script>
    (function () {
      async function ensureBootstrap() {
        if (window.__vr_bootstrap_ready) return;
        try {
          if (typeof window.bootstrapAuthAndProfile === "function") {
            await window.bootstrapAuthAndProfile();
          }
        } catch (_) {}
        window.__vr_bootstrap_ready = true;
      }

      ensureBootstrap();

      window.vrWaitBootstrap = async function () {
        if (window.__vr_bootstrap_ready) return true;
        var t0 = Date.now();
        while (!window.__vr_bootstrap_ready && (Date.now() - t0) < 3000) {
          await new Promise(function (r) { setTimeout(r, 50); });
        }
        return !!window.__vr_bootstrap_ready;
      };
    })();
  </script>

  <script src="js/userData.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/purchases.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
