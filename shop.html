<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>VRealms - Boutique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="vr-body">
  <header class="vr-header" aria-label="Top actions">
    <div class="vr-top-actions">
      <button class="vr-icon-button" type="button" id="btn-profile" aria-label="Profile">
        <span class="vr-icon-image vr-icon-profile"></span>
      </button>
      <button class="vr-icon-button" type="button" id="btn-settings" aria-label="Settings">
        <span class="vr-icon-image vr-icon-settings"></span>
      </button>
      <button class="vr-icon-button" type="button" id="btn-shop" aria-label="Shop">
        <span class="vr-icon-image vr-icon-shop"></span>
      </button>
    </div>
  </header>

  <div class="vr-overlay"></div>

  <main class="vr-main">
    <section id="view-shop" class="vr-view vr-view-active">
      <h2 class="vr-section-title" data-i18n="shop.title"></h2>

      <div class="vr-profile-grid">

        <!-- Rewarded -->
        <div class="vr-profile-card">
          <h3 class="vr-profile-title" data-i18n="shop.rewarded_title"></h3>
          <p class="vr-profile-text" data-i18n="shop.rewarded_desc"></p>

          <button class="vr-choice-button" id="btn-reward-jeton" type="button">
            <span data-i18n="shop.get_jeton"></span>
          </button>

          <button class="vr-choice-button" id="btn-reward-coins" type="button">
            <span data-i18n="shop.get_300_coins"></span>
          </button>

          <p class="vr-profile-text" id="shop-status" style="opacity:.85;margin-top:10px;"></p>
        </div>

        <!-- No Ads -->
        <div class="vr-profile-card">
          <h3 class="vr-profile-title" data-i18n="shop.noads_title"></h3>
          <p class="vr-profile-text" data-i18n="shop.noads_desc"></p>

          <button class="vr-choice-button" id="btn-buy-noads" type="button">
            <span data-i18n="shop.noads_buy"></span>
            <span class="vr-price" data-price-for="vrealms_no_ads" style="margin-left:8px;opacity:.9;"></span>
          </button>

          <p class="vr-profile-text" id="noads-status" style="opacity:.85;margin-top:10px;"></p>
        </div>

        <!-- Pièces -->
        <div class="vr-profile-card">
          <h3 class="vr-profile-title" data-i18n="shop.coins_title"></h3>
          <p class="vr-profile-text" data-i18n="shop.coins_desc"></p>

          <button class="vr-choice-button" id="btn-buy-coins-300" type="button">
            <span data-i18n="shop.coins_300"></span>
            <span class="vr-price" data-price-for="vrealms_coins_300" style="margin-left:8px;opacity:.9;"></span>
          </button>

          <button class="vr-choice-button" id="btn-buy-coins-500" type="button">
            <span data-i18n="shop.coins_500"></span>
            <span class="vr-price" data-price-for="vrealms_coins_500" style="margin-left:8px;opacity:.9;"></span>
          </button>

          <button class="vr-choice-button" id="btn-buy-coins-3000" type="button">
            <span data-i18n="shop.coins_3000"></span>
            <span class="vr-price" data-price-for="vrealms_coins_3000" style="margin-left:8px;opacity:.9;"></span>
          </button>
        </div>

        <!-- Jetons -->
        <div class="vr-profile-card">
          <h3 class="vr-profile-title" data-i18n="shop.jetons_title"></h3>
          <p class="vr-profile-text" data-i18n="shop.jetons_desc"></p>

          <button class="vr-choice-button" id="btn-buy-jetons-5" type="button">
            <span data-i18n="shop.jetons_5"></span>
            <span class="vr-price" data-price-for="vrealms_jetons_5" style="margin-left:8px;opacity:.9;"></span>
          </button>

          <button class="vr-choice-button" id="btn-buy-jetons-12" type="button">
            <span data-i18n="shop.jetons_12"></span>
            <span class="vr-price" data-price-for="vrealms_jetons_12" style="margin-left:8px;opacity:.9;"></span>
          </button>

          <button class="vr-choice-button" id="btn-buy-jetons-50" type="button">
            <span data-i18n="shop.jetons_50"></span>
            <span class="vr-price" data-price-for="vrealms_jetons_50" style="margin-left:8px;opacity:.9;"></span>
          </button>
        </div>

      </div>
    </section>
  </main>

  <!-- Cordova/Capacitor bridge (en app; en web ça peut 404, c’est OK) -->
  <script src="cordova.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseBootstrap.js"></script>

  <!-- ✅ Mini bootstrap: assure session + profile avant scripts qui utilisent sb.rpc -->
  <script>
    (function () {
      "use strict";
      window.__vr_bootstrap_ready = false;

      async function ensureBootstrap() {
        try {
          if (typeof window.bootstrapAuthAndProfile === "function") {
            await window.bootstrapAuthAndProfile();
          }
        } catch (_) {}
        window.__vr_bootstrap_ready = true;
      }

      ensureBootstrap();

      window.vrWaitBootstrap = async function () {
        if (window.__vr_bootstrap_ready) return true;
        var t0 = Date.now();
        while (!window.__vr_bootstrap_ready && (Date.now() - t0) < 3000) {
          await new Promise(function (r) { setTimeout(r, 50); });
        }
        return !!window.__vr_bootstrap_ready;
      };
    })();
  </script>

  <script src="js/userData.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/purchases.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
