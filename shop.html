<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title></title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    :root{
      --vr-bg: radial-gradient(circle at top, #f6e7cf 0, #1b6688 62%, #03279e 100%);
      --vr-overlay: none;

      --shop-gap: 8px;
      --shop-item-radius: 16px;
      --shop-item-pad: 10px;
      --shop-icon: 42px;
      --shop-btn-h: 38px;

      --u-gap: 14px;
      --u-radius: 20px;

      --cos-arrow: 36px;
      --cos-card-r: 18px;
      --cos-card-h: 124px;
    }

    .vr-header{
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display:block !important;
    }

    .vr-top-actions{
      width:100%;
      display:grid;
      grid-template-columns: 44px minmax(0,1fr) 44px;
      align-items:center;
      gap:12px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 6px;
    }

    .vr-top-slot{
      display:flex;
      align-items:center;
      min-width:0;
    }

    .vr-top-left{ justify-content:flex-start; }
    .vr-top-center{ justify-content:center; }
    .vr-top-right{ justify-content:flex-end; }

    .vr-top-balances{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:22px;
      width:100%;
    }

    .vr-top-balance{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0;
      min-width:0;
      height:auto;
      background:none;
      border:0;
      box-shadow:none;
      border-radius:0;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
    }

    .vr-top-balance img{
      width:22px;
      height:22px;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.48));
      pointer-events:none;
      user-select:none;
    }

    .vr-top-balance span{
      font-weight:1000;
      font-size:18px;
      line-height:1;
      color:rgba(255,255,255,.98);
      text-shadow:0 8px 18px rgba(0,0,0,.45);
      white-space:nowrap;
    }

    .vr-icon-button{
      width:44px;
      height:44px;
      border-radius:999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.26);
      box-shadow: 0 10px 22px rgba(0,0,0,0.22);
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      text-decoration:none;
      -webkit-tap-highlight-color: transparent;
    }

    .vr-icon-button:active{ transform: scale(.98); }

    .vr-icon-button img{
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
      pointer-events:none;
      user-select:none;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65)) contrast(1.15) brightness(1.08);
    }

    .vr-back-ico{
      width:24px;
      height:24px;
      display:block;
      opacity:.98;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.65));
    }

    .vr-section-title,
    .vr-profile-title{
      text-align:center !important;
      color: rgba(255,255,255,.96) !important;
      margin-left:auto !important;
      margin-right:auto !important;
    }

    #view-shop .vr-section-title{
      margin-top: 4px !important;
      margin-bottom: 10px !important;
    }

    .vr-profile-title{
      margin-top: 10px !important;
      margin-bottom: 10px !important;
    }

    .vr-shop-block{
      margin: 8px 0 12px;
    }

    .vr-shop-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--shop-gap);
    }

    .vr-shop-item{
      position: relative;
      overflow: hidden;
      border-radius: var(--shop-item-radius);
      padding: var(--shop-item-pad);
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      box-shadow: 0 18px 34px rgba(0,0,0,.30);
    }

    .vr-shop-item::before{
      content:"";
      position:absolute;
      inset:-1px;
      pointer-events:none;
      background:
        radial-gradient(420px 180px at 20% 12%, rgba(255,255,255,.08), transparent 60%),
        radial-gradient(420px 220px at 75% 18%, rgba(255,59,59,.10), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 45%);
      opacity:.9;
    }

    .vr-shop-top{
      position: relative;
      z-index: 1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 8px;
      min-height: 74px;
      margin-bottom: 10px;
    }

    .vr-shop-icon{
      width: var(--shop-icon);
      height: var(--shop-icon);
      max-width: var(--shop-icon);
      max-height: var(--shop-icon);
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,.50));
      user-select:none;
      pointer-events:none;
    }

    .vr-shop-qty{
      position: relative;
      z-index: 1;
      width:100%;
      font-weight: 950;
      font-size: 16px;
      letter-spacing: .2px;
      color: rgba(255,255,255,.96);
      text-shadow: 0 10px 20px rgba(0,0,0,.50);
      line-height: 1;
      text-align:center;
    }

    .vr-shop-item .vr-choice-button{
      position: relative;
      z-index: 1;
      width: 100%;
      border-radius: 13px;
      padding: 9px 10px;
      min-height: var(--shop-btn-h);
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color: rgba(255,255,255,.96) !important;
    }

    .vr-shop-item .vr-choice-button span{
      color: inherit !important;
      opacity: 1 !important;
    }

    .vr-shop-item .vr-choice-button:active{
      transform: translateY(1px);
    }

    .vr-shop-item img,
    .vr-shop-item svg{
      max-width: 100%;
      height: auto;
    }

    .vr-shop-item[data-sku="vuniverse_no_ads"] .vr-shop-top{
      justify-content:center;
    }

    #store-grid .vr-shop-item[data-sku="vuniverse_diamond"] .vr-shop-top{
      flex-direction:column !important;
      align-items:center !important;
      justify-content:flex-start !important;
      gap:3px !important;
      min-height:82px !important;
      padding-top:10px;
    }

    #store-grid .vr-shop-item[data-sku="vuniverse_diamond"] .vr-shop-icon{
      transform: translateY(2px);
      animation: vrDiamondPulse 0.95s ease-in-out infinite;
      filter:
        drop-shadow(0 0 14px rgba(255,210,90,.58))
        drop-shadow(0 10px 18px rgba(0,0,0,.42));
    }

    #store-grid .vr-shop-item[data-sku="vuniverse_diamond"] .vr-shop-badge-subtitle{
      margin-top:2px;
      max-width:112px;
      font-weight:1000;
      font-size:11px;
      line-height:1.08;
      text-align:center;
      color:#f7d46e;
      letter-spacing:.2px;
      text-shadow:
        0 2px 10px rgba(0,0,0,.42),
        0 0 16px rgba(247,212,110,.42);
    }

    @keyframes vrDiamondPulse{
      0%, 100%{
        opacity:1;
        transform:translateY(2px) scale(1);
      }
      50%{
        opacity:.55;
        transform:translateY(0px) scale(1.09);
      }
    }

    #shop-status,
    #store-status{
      display:none !important;
    }

    .vr-cosmetics{
      display:flex;
      flex-direction:column;
      gap: var(--u-gap);
      margin-top: 14px;
      padding-bottom: 10px;
    }

    .vr-universe-block{
      position:relative;
      overflow:hidden;
      border-radius: var(--u-radius);
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      box-shadow: 0 18px 34px rgba(0,0,0,.26);
      padding: 14px 12px 12px;
    }

    .vr-universe-block::before{
      content:"";
      position:absolute;
      inset:-2px;
      pointer-events:none;
      background:
        radial-gradient(520px 220px at 15% 12%, rgba(255,255,255,.08), transparent 60%),
        radial-gradient(520px 260px at 85% 18%, rgba(255,214,156,.08), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%);
      opacity:.9;
    }

    .vr-universe-title{
      position:relative;
      z-index:1;
      text-align:center;
      font-weight:950;
      font-size: 19px;
      line-height:1.1;
      color: rgba(255,255,255,.96);
      margin: 0 0 12px;
      text-shadow: 0 12px 24px rgba(0,0,0,.55);
    }

    .vr-cos-row{
      position:relative;
      z-index:1;
      margin: 0 0 14px;
    }

    .vr-cos-row:last-child{
      margin-bottom: 0;
    }

    .vr-cos-subtitle{
      text-align:center;
      font-weight:900;
      font-size:13px;
      color: rgba(255,255,255,.92);
      margin: 0 0 8px;
      letter-spacing:.15px;
    }

    .vr-cos-carousel{
      display:grid;
      grid-template-columns: var(--cos-arrow) minmax(0, 1fr) var(--cos-arrow);
      align-items:center;
      gap: 8px;
    }

    /* ✅ flèches SANS encadré rond */
    .vr-cos-arrow{
      width: var(--cos-arrow);
      height: var(--cos-arrow);
      border:none;
      background: transparent;
      box-shadow:none;
      border-radius:0;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      color: rgba(255,255,255,.96);
      font-size: 28px;
      font-weight: 900;
      line-height:1;
      user-select:none;
      text-shadow: 0 10px 22px rgba(0,0,0,.45);
      -webkit-tap-highlight-color: transparent;
    }

    .vr-cos-arrow:active{
      transform: scale(.97);
    }

    .vr-cos-arrow[disabled]{
      opacity:.42;
      cursor:default;
    }

    .vr-cos-viewport{
      min-width:0;
      overflow:hidden;
      touch-action: pan-y;
    }

    .vr-cos-track{
      display:flex;
      transition: transform .24s ease;
      will-change: transform;
    }

    .vr-cos-slide{
      min-width:100%;
      width:100%;
      box-sizing:border-box;
    }

    .vr-cos-card{
      position:relative;
      overflow:hidden;
      border-radius: var(--cos-card-r);
      height: var(--cos-card-h);
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.24);
      box-shadow: 0 16px 28px rgba(0,0,0,.28);
    }

    .vr-cos-card::before{
      content:"";
      position:absolute;
      inset:-1px;
      pointer-events:none;
      background:
        radial-gradient(260px 120px at 18% 12%, rgba(255,255,255,.10), transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 55%);
      opacity:.95;
      z-index:1;
    }

    .vr-cos-card > img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      z-index:0;
      user-select:none;
      pointer-events:none;
    }

    .vr-cos-card.is-ui > img{
      object-fit: contain;
      padding: 14px;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,.10), transparent 46%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.08));
    }

    .vr-cos-overlay{
      position:absolute;
      inset:auto 0 0 0;
      z-index:2;
      padding: 30px 10px 10px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.72));
    }

    .vr-cos-name{
      text-align:center;
      font-weight:900;
      font-size:13px;
      color: rgba(255,255,255,.96);
      line-height:1.15;
      margin-bottom: 8px;
      text-shadow: 0 8px 18px rgba(0,0,0,.45);
    }

    .vr-cos-bottom{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap: 8px;
    }

    .vr-cos-count{
      color: rgba(255,255,255,.86);
      font-size:12px;
      font-weight:900;
      text-shadow: 0 8px 18px rgba(0,0,0,.45);
    }

    .vr-cos-action{
      width:100%;
      margin-top:8px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.22);
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    .vr-cos-action-content{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      line-height:1;
    }

    .vr-cos-action-ico{
      width:14px;
      height:14px;
      min-width:14px;
      min-height:14px;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));
    }

    .vr-cos-action.is-owned{
      background:rgba(255,255,255,.10);
    }

    .vr-cos-action.is-equipped{
      background:rgba(138,197,95,.22);
      border-color:rgba(138,197,95,.55);
    }

    .vr-cos-dots{
      display:flex;
      justify-content:center;
      gap:6px;
      margin-top: 8px;
    }

    .vr-cos-dot{
      width:7px;
      height:7px;
      border-radius:999px;
      background: rgba(255,255,255,.28);
      box-shadow: 0 4px 10px rgba(0,0,0,.22);
    }

    .vr-cos-dot.active{
      background: rgba(255,255,255,.92);
    }


    /* ==========================================================
       SHOP responsive : on garde 2 colonnes, on scale seulement
       ========================================================== */

    body.page-shop .vr-main{
      width: min(100%, 980px);
      margin: 0 auto;
      padding-left: clamp(12px, 2vw, 24px);
      padding-right: clamp(12px, 2vw, 24px);
    }

    body.page-shop #view-shop{
      width: 100%;
    }

    body.page-shop .vr-shop-block{
      max-width: 100%;
    }

    /* tablette */
    @media (min-width: 700px){
      :root{
        --shop-gap: 12px;
        --shop-item-radius: 18px;
        --shop-item-pad: 13px;
        --shop-icon: 50px;
        --shop-btn-h: 42px;

        --u-gap: 16px;
        --u-radius: 22px;

        --cos-arrow: 40px;
        --cos-card-r: 20px;
        --cos-card-h: 138px;
      }

      .vr-top-actions{
        grid-template-columns: 48px minmax(0,1fr) 48px;
        gap: 14px;
        padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
      }

      .vr-top-balances{
        gap: 26px;
      }

      .vr-top-balance img{
        width: 20px;
        height: 20px;
      }

      .vr-top-balance span{
        font-size: 17px;
      }

      .vr-icon-button{
        width: 48px;
        height: 48px;
      }

      .vr-icon-button img{
        width: 30px;
        height: 30px;
      }

      .vr-back-ico{
        width: 24px;
        height: 24px;
      }

      #view-shop .vr-section-title{
        margin-top: 8px !important;
        margin-bottom: 12px !important;
      }

      .vr-profile-title{
        margin-top: 14px !important;
        margin-bottom: 12px !important;
      }

      .vr-shop-block{
        margin: 10px 0 16px;
      }

      .vr-shop-top{
        gap: 9px;
        min-height: 86px;
        margin-bottom: 12px;
      }

      .vr-shop-qty{
        font-size: 18px;
      }

      .vr-shop-item .vr-choice-button{
        min-height: 42px;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 14px;
      }

      .vr-universe-block{
        padding: 16px 14px 14px;
      }

      .vr-universe-title{
        font-size: 21px;
        margin-bottom: 14px;
      }

      .vr-cos-row{
        margin-bottom: 16px;
      }

      .vr-cos-subtitle{
        font-size: 14px;
        margin-bottom: 10px;
      }

      .vr-cos-name{
        font-size: 14px;
      }

      .vr-cos-action{
        min-height: 42px;
        font-size: 13px;
      }

      .vr-cos-action-ico{
        width: 15px;
        height: 15px;
        min-width: 15px;
        min-height: 15px;
      }

      .vr-cos-dots{
        margin-top: 10px;
      }

      .vr-cos-dot{
        width: 8px;
        height: 8px;
      }
    }

    /* desktop / grand écran */
    @media (min-width: 1100px){
      body.page-shop .vr-main{
        width: min(100%, 1080px);
        padding-left: 26px;
        padding-right: 26px;
      }

      :root{
        --shop-gap: 14px;
        --shop-item-radius: 20px;
        --shop-item-pad: 15px;
        --shop-icon: 58px;
        --shop-btn-h: 46px;

        --u-gap: 18px;
        --u-radius: 24px;

        --cos-arrow: 42px;
        --cos-card-r: 22px;
        --cos-card-h: 148px;
      }

      .vr-top-actions{
        grid-template-columns: 52px minmax(0,1fr) 52px;
        gap: 16px;
        padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
      }

      .vr-top-balances{
        gap: 32px;
      }

      .vr-top-balance img{
        width: 22px;
        height: 22px;
      }

      .vr-top-balance span{
        font-size: 19px;
      }

      .vr-icon-button{
        width: 52px;
        height: 52px;
      }

      .vr-icon-button img{
        width: 33px;
        height: 33px;
      }

      .vr-back-ico{
        width: 26px;
        height: 26px;
      }

      #view-shop .vr-section-title{
        margin-top: 10px !important;
        margin-bottom: 14px !important;
      }

      .vr-profile-title{
        margin-top: 16px !important;
        margin-bottom: 14px !important;
      }

      .vr-shop-block{
        margin: 12px 0 18px;
      }

      .vr-shop-top{
        gap: 10px;
        min-height: 96px;
        margin-bottom: 14px;
      }

      .vr-shop-qty{
        font-size: 20px;
      }

      .vr-shop-item .vr-choice-button{
        min-height: 46px;
        padding: 11px 14px;
        border-radius: 15px;
        font-size: 15px;
      }

      .vr-universe-block{
        padding: 18px 16px 16px;
      }

      .vr-universe-title{
        font-size: 23px;
        margin-bottom: 16px;
      }

      .vr-cos-row{
        margin-bottom: 18px;
      }

      .vr-cos-subtitle{
        font-size: 15px;
        margin-bottom: 11px;
      }

      .vr-cos-name{
        font-size: 15px;
      }

      .vr-cos-action{
        min-height: 44px;
        font-size: 14px;
      }

      .vr-cos-action-ico{
        width: 16px;
        height: 16px;
        min-width: 16px;
        min-height: 16px;
      }

      .vr-cos-dots{
        margin-top: 11px;
      }

      .vr-cos-dot{
        width: 9px;
        height: 9px;
      }
    }

    @media (max-width: 390px){
      :root{
        --shop-icon: 40px;
        --cos-card-h: 112px;
        --cos-arrow: 34px;
      }

      .vr-top-balances{
        gap:12px;
      }

      .vr-top-balance img{
        width:15px;
        height:15px;
      }

      .vr-top-balance span{
        font-size:12px;
      }

      .vr-cos-action-ico{
        width:13px;
        height:13px;
        min-width:13px;
        min-height:13px;
      }
    }
  </style>
</head>

<body class="vr-body page-shop" data-page="shop">

  <header class="vr-header" aria-label="" data-i18n-aria="shop.aria_top">
    <div class="vr-top-actions">
      <div class="vr-top-slot vr-top-left">
        <a id="btn-back" class="vr-icon-button" href="index.html" aria-label="" data-i18n-aria="common.back">
          <svg class="vr-back-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="white" d="M15.5 5.5a1 1 0 0 1 0 1.4L10.4 12l5.1 5.1a1 1 0 1 1-1.4 1.4l-5.8-5.8a1.2 1.2 0 0 1 0-1.4l5.8-5.8a1 1 0 0 1 1.4 0z"/>
          </svg>
        </a>
      </div>

      <div class="vr-top-slot vr-top-center">
        <div class="vr-top-balances" aria-hidden="true">
          <div class="vr-top-balance">
            <img src="assets/img/ui/vcoins.webp" alt="" draggable="false" />
            <span id="top-vcoins-balance">0</span>
          </div>

          <div class="vr-top-balance">
            <img src="assets/img/ui/jeton.webp" alt="" draggable="false" />
            <span id="top-jetons-balance">0</span>
          </div>
        </div>
      </div>

      <div class="vr-top-slot vr-top-right">
        <a id="btn-profile" class="vr-icon-button" href="profile.html" aria-label="" data-i18n-aria="shop.aria_profile">
          <img src="assets/img/ui/btn_profile.webp" alt="" draggable="false" />
        </a>
      </div>
    </div>
  </header>

  <main class="vr-main">
    <section id="view-shop" class="vr-view vr-view-active">

      <h2 class="vr-section-title" data-i18n="shop.title"></h2>

      <div class="vr-shop-block">
        <div class="vr-shop-grid" id="reward-grid">

  <script>
    (function () {
      async function ensureBootstrap() {
        if (window.__vr_bootstrap_ready) return;
        try {
          if (typeof window.bootstrapAuthAndProfile === "function") {
            await window.bootstrapAuthAndProfile();
          }
        } catch (_) {}
        window.__vr_bootstrap_ready = true;
      }

      ensureBootstrap();

      window.vrWaitBootstrap = async function () {
        if (window.__vr_bootstrap_ready) return true;
        var t0 = Date.now();
        while (!window.__vr_bootstrap_ready && (Date.now() - t0) < 3000) {
          await new Promise(function (r) { setTimeout(r, 50); });
        }
        return !!window.__vr_bootstrap_ready;
      };
    })();
  </script>
