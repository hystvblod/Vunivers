<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Vuniverse - Profil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="vr-body">

  <header class="vr-header" aria-label="Top actions">
    <div class="vr-top-actions">
      <button class="vr-icon-button" type="button" id="btn-profile" aria-label="Profile">
        <span class="vr-icon-image vr-icon-profile"></span>
      </button>
      <button class="vr-icon-button" type="button" id="btn-settings" aria-label="Settings">
        <span class="vr-icon-image vr-icon-settings"></span>
      </button>
      <button class="vr-icon-button" type="button" id="btn-shop" aria-label="Shop">
        <span class="vr-icon-image vr-icon-shop"></span>
      </button>
    </div>
  </header>

  <div class="vr-overlay"></div>

  <main class="vr-main">
    <section id="view-profile" class="vr-view vr-view-active">
      <h2 class="vr-section-title" data-i18n="profile.title"></h2>
      <div class="vr-profile-grid">
        <div class="vr-profile-card">
          <p><strong data-i18n="auth.username.label"></strong> : <span id="profile-username">—</span></p>
          <p><strong data-i18n="profile.vcoins"></strong> : <span id="profile-vcoins">—</span></p>
          <p><strong data-i18n="shop.jetons_title"></strong> : <span id="profile-jetons">—</span></p>
          <p><strong data-i18n="profile.bestReign"></strong> : <span id="profile-best-reign">—</span></p>
          <p><strong data-i18n="profile.totalRuns"></strong> : <span id="profile-total-runs">—</span></p>
        </div>
      </div>
    </section>
  </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseBootstrap.js"></script>

  <script src="js/userData.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/game.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // ✅ Auth + profil Supabase (sinon profile reste vide)
      try { await window.bootstrapAuthAndProfile?.(); } catch (_) {}

      // ✅ Hydrate cache local puis refresh DB (source de vérité)
      try { await window.VUserData?.init?.(); } catch (_) {}

      function render() {
        const user = window.VUserData?.load?.() || {};
        const username = (user.username || "").toString().trim();

        const elU = document.getElementById("profile-username");
        const elVC = document.getElementById("profile-vcoins");
        const elJ = document.getElementById("profile-jetons");
        const elBR = document.getElementById("profile-best-reign");
        const elTR = document.getElementById("profile-total-runs");

        if (elU) elU.textContent = username || "—";
        if (elVC) elVC.textContent = user.vcoins ?? 0;
        if (elJ) elJ.textContent = user.jetons ?? 0;

        // compat: top-level ou stats.*
        const best = (typeof user.best_reign_length !== "undefined") ? user.best_reign_length : (user.stats?.bestReignLength ?? 0);
        const runs = (typeof user.total_runs !== "undefined") ? user.total_runs : (user.stats?.totalRuns ?? 0);

        if (elBR) elBR.textContent = best ?? 0;
        if (elTR) elTR.textContent = runs ?? 0;
      }

      window.addEventListener("vr:profile", render);
      render();

      // Resync quand on revient sur l’onglet
      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible") {
          try { await window.VUserData?.refresh?.(); } catch (_) {}
        }
      });
    });
  </script>
</body>
</html>
