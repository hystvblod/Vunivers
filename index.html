<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Vuniverse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ----- PAGE INDEX : fond + layout ----- */
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(1200px 700px at 50% 20%, rgba(122,167,255,.10), transparent 55%),
                  linear-gradient(180deg, #0b0d12 0%, #07080c 100%);
      color: #eaeef7;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    :root{
      --bg:#0b0d12;
      --text:#eaeef7;
      --muted:#c8d0e6;
      --muted2:#8e97ad;
      --border:rgba(255,255,255,.12);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --r:18px;
      --accent:#7aa7ff;

      --topbar-h: 64px;
      --pad: clamp(14px, 3.6vw, 22px);
      --title: clamp(18px, 2.6vmin, 30px);
      --body: clamp(14px, 2.1vmin, 16px);
    }

    .vr-topbar{
      position: fixed;
      top: 0; left: 0; right: 0;
      height: calc(var(--topbar-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-left: 14px;
      padding-right: 14px;
      background: linear-gradient(180deg, rgba(10,12,18,.92) 0%, rgba(10,12,18,.55) 60%, rgba(10,12,18,0) 100%);
      z-index: 10000;
      pointer-events: none;
    }
    .vr-topbar > *{ pointer-events: auto; }

    .vr-icon-button{
      width: 44px; height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      text-decoration: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .vr-icon-button:active{ transform: translateY(1px); }
    .vr-top-icon{ width: 26px; height: 26px; opacity: .95; }

    .vr-main{
      padding-top: calc(var(--topbar-h) + env(safe-area-inset-top) + 18px);
      padding-left: var(--pad);
      padding-right: var(--pad);
      padding-bottom: 34px;
      max-width: 980px;
      margin: 0 auto;
    }

    .vr-hero{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      margin-bottom: 18px;
      text-align: center;
    }
    .vr-main-logo{
      height: clamp(86px, 16vmin, 150px);
      max-width: min(520px, 92vw);
      object-fit: contain;
      filter: drop-shadow(0 18px 34px rgba(0,0,0,.45));
    }
    .vr-subtitle{
      margin: 0;
      font-size: var(--title);
      font-weight: 700;
      letter-spacing: .2px;
    }
    .vr-subtitle-desc{
      margin: 0;
      margin-top: -2px;
      font-size: var(--body);
      color: var(--muted);
      line-height: 1.35;
      max-width: 720px;
    }

    .vr-section-title{
      margin: 18px 0 10px;
      font-size: 16px;
      color: var(--muted2);
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    .vr-universe-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (min-width: 760px){
      .vr-universe-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .vr-card{
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      overflow: hidden;
      position: relative;
      min-height: 92px;
      display: flex;
      align-items: stretch;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }
    .vr-card:hover{ transform: translateY(-1px); background: rgba(255,255,255,.075); }
    .vr-card:active{ transform: translateY(0px); }

    .vr-card-inner{
      padding: 14px 14px 14px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }

    .vr-card-badge{
      width: 42px; height: 42px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(122,167,255,.10);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .vr-card-badge img{ width: 22px; height: 22px; opacity: .95; }

    .vr-card-text{ flex: 1 1 auto; min-width: 0; }
    .vr-card-title{
      margin: 0;
      font-weight: 800;
      font-size: 16px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vr-card-sub{
      margin: 0;
      margin-top: 3px;
      font-size: 13px;
      color: var(--muted);
      opacity: .95;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vr-info-btn{
      width: 42px; height: 42px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex: 0 0 auto;
      cursor: pointer;
    }
    .vr-info-btn:hover{ background: rgba(255,255,255,.09); }

    .vr-lock{
      position: absolute;
      top: 10px; right: 10px;
      width: 24px; height: 24px;
      opacity: .95;
      display: none;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
    }
    .vr-card.locked .vr-lock{ display: block; }
    .vr-card.locked{
      outline: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.045);
    }

    .vr-selected{
      outline: 2px solid rgba(122,167,255,.50);
      box-shadow: 0 22px 64px rgba(122,167,255,.14), 0 18px 60px rgba(0,0,0,.45);
    }

    .vr-footer{
      margin: 22px 0 0;
      text-align: center;
      color: var(--muted2);
      font-size: 12px;
      opacity: .9;
    }

    /* ----- TOOLTIP ----- */
    .vr-tooltip{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(14px + env(safe-area-inset-bottom));
      width: min(560px, calc(100vw - 28px));
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(12,14,20,.92);
      box-shadow: 0 18px 70px rgba(0,0,0,.60);
      padding: 14px 14px 12px;
      z-index: 10050;
      display: none;
      backdrop-filter: blur(10px);
    }
    .vr-tooltip.show{ display:block; }
    .vr-tooltip-title{
      margin: 0;
      font-weight: 900;
      font-size: 16px;
    }
    .vr-tooltip-body{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .vr-tooltip-actions{
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .vr-tooltip-btn{
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .vr-tooltip-btn.primary{
      border-color: rgba(122,167,255,.35);
      background: rgba(122,167,255,.12);
    }

    /* ----- POPUP UNLOCK ----- */
    .vr-pop-overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10100;
    }
    .vr-pop-overlay.show{ display:flex; }
    .vr-pop{
      width: min(520px, calc(100vw - 28px));
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(12,14,20,.94);
      box-shadow: 0 20px 85px rgba(0,0,0,.68);
      padding: 16px;
      backdrop-filter: blur(12px);
    }
    .vr-pop-title{
      margin: 0;
      font-weight: 1000;
      letter-spacing: .2px;
      font-size: 18px;
    }
    .vr-pop-body{
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    #vr-buy-actions{
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }
    .vr-buy-btn{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 900;
      padding: 12px 12px;
      cursor: pointer;
    }
    .vr-buy-btn.primary{
      border-color: rgba(122,167,255,.35);
      background: rgba(122,167,255,.14);
    }
    .vr-buy-btn.ghost{
      background: rgba(255,255,255,.04);
    }
    .vr-buy-btn:disabled{
      opacity: .55;
      cursor: not-allowed;
    }
    #vr-buy-error{
      margin-top: 10px;
      color: #ffb4b4;
      font-size: 12.5px;
      display: none;
    }
    #vr-buy-error.show{ display:block; }

    /* ----- POPUP USERNAME ----- */
    .vr-usr-overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.64);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10200;
    }
    .vr-usr-overlay.show{ display:flex; }
    .vr-usr{
      width: min(520px, calc(100vw - 28px));
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(12,14,20,.94);
      box-shadow: 0 20px 85px rgba(0,0,0,.70);
      padding: 16px;
      backdrop-filter: blur(12px);
    }
    .vr-usr-title{ margin: 0; font-weight: 1000; font-size: 18px; }
    .vr-usr-sub{ margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .vr-usr-row{ margin-top: 12px; display: grid; gap: 10px; }
    .vr-usr-input{
      width: 100%;
      box-sizing: border-box;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 12px 12px;
      font-weight: 800;
      outline: none;
    }
    .vr-usr-hint{ color: var(--muted2); font-size: 12px; margin-top: -4px; }
    .vr-usr-actions{ margin-top: 12px; display: grid; gap: 10px; }
    .vr-usr-btn{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-weight: 900;
      padding: 12px 12px;
      cursor: pointer;
    }
    .vr-usr-btn.primary{
      border-color: rgba(122,167,255,.35);
      background: rgba(122,167,255,.14);
    }
    .vr-usr-err{
      margin-top: 10px;
      color: #ffb4b4;
      font-size: 12.5px;
      display: none;
    }
    .vr-usr-err.show{ display:block; }

    @media (max-width: 520px){
      .vr-main{ padding-top: calc(var(--topbar-h) + env(safe-area-inset-top) + 12px); }
      .vr-card{ min-height: 78px; }
      .vr-card-title{ font-size: 14px; }
      .vr-info-btn{ width: 38px; height: 38px; font-size: 15px; }
      .vr-icon-button{ width: 40px; height: 40px; }
      .vr-icon-button img{ width: 28px; height: 28px; }
      .vr-main-logo{
        height: clamp(80px, 13vmin, 120px);
        max-width: clamp(240px, 78vw, 380px);
      }
    }
  </style>
</head>

  <script>
    // Petite aide i18n : _t(key, fallback, vars)
    function _t(key, fallback, vars){
      try {
        var s = (window.VRI18n && typeof window.VRI18n.t === "function") ? window.VRI18n.t(key) : "";
        if (!s || s === key) s = fallback || "";
        if (vars && s) {
          Object.keys(vars).forEach(function(k){
            s = s.replace(new RegExp("\\\\{"+k+"\\\\}", "g"), String(vars[k]));
          });
        }
        return s;
      } catch(e){
        return fallback || "";
      }
    }
  </script>

  <script>
    // ---------------------------
    // TOOLTIP (infos univers)
    // ---------------------------
    (function(){
      const tip = document.getElementById("vr-tooltip");
      const tipTitle = document.getElementById("vr-tooltip-title");
      const tipBody = document.getElementById("vr-tooltip-body");
      const closeBtn = document.getElementById("vr-tooltip-close");

      function openTip(titleKey, bodyKey){
        tipTitle.textContent = _t(titleKey, "");
        tipBody.textContent = _t(bodyKey, "");
        closeBtn.textContent = _t("common.close", "Fermer");
        tip.classList.add("show");
      }
      function closeTip(){
        tip.classList.remove("show");
      }

      document.addEventListener("click", (e)=>{
        const btn = e.target.closest("[data-i18n-tip]");
        if (btn){
          e.preventDefault();
          openTip(btn.getAttribute("data-i18n-tip-title"), btn.getAttribute("data-i18n-tip"));
          return;
        }
        if (e.target === tip) closeTip();
      });

      closeBtn.addEventListener("click", closeTip);
      document.addEventListener("keydown", (e)=>{
        if (e.key === "Escape") closeTip();
      });
    })();
  </script>

      const KEY_PREFIX = "vrealms_";
      const LEGACY_PREFIX = "vr_";

      const IAP_TARGET_KEY = (KEY_PREFIX + "iap_target_universe"); // pending universe to unlock after coins credited

      // Popup refs
      const buyOverlay = document.getElementById("vr-buy-overlay");
      const buyTitle = document.getElementById("vr-buy-title");
      const buyDesc = document.getElementById("vr-buy-desc");
      const buyPay = document.getElementById("vr-buy-pay");
      const buyIap = document.getElementById("vr-buy-iap");
      const buyCancel = document.getElementById("vr-buy-cancel");
      const buyError = document.getElementById("vr-buy-error");

      // Cards
      const grid = document.getElementById("vr-universe-grid");
      const cards = Array.from(grid.querySelectorAll(".vr-card"));

      // Helper: read selected universe (compat vrealms_ / vr_)
      function getSelectedUniverse() {
        return localStorage.getItem(KEY_PREFIX + "universe") ||
               localStorage.getItem(LEGACY_PREFIX + "universe") ||
               "hell_king";
      }
      function setSelectedUniverse(id) {
        localStorage.setItem(KEY_PREFIX + "universe", id);
        // legacy mirror
        try { localStorage.setItem(LEGACY_PREFIX + "universe", id); } catch(e){}
      }

      // Helper: unlocked list (set)
      function getUnlockedSet() {
        // priority new key, else legacy
        let raw = localStorage.getItem(KEY_PREFIX + "unlocked_universes");
        if (!raw) raw = localStorage.getItem(LEGACY_PREFIX + "unlocked_universes");
        let arr = [];
        try { arr = raw ? JSON.parse(raw) : []; } catch(e){ arr = []; }
        if (!Array.isArray(arr)) arr = [];
        // always ensure base universe
        if (!arr.includes("hell_king")) arr.unshift("hell_king");
        return new Set(arr);
      }
      function setUnlockedSet(set) {
        const arr = Array.from(set);
        localStorage.setItem(KEY_PREFIX + "unlocked_universes", JSON.stringify(arr));
        try { localStorage.setItem(LEGACY_PREFIX + "unlocked_universes", JSON.stringify(arr)); } catch(e){}
      }

      // UI: update locks & selected highlight
      function updateUniverseLocks() {
        const unlocked = getUnlockedSet();
        const selected = getSelectedUniverse();
        cards.forEach(card=>{
          const id = card.getAttribute("data-universe");
          const isUnlocked = unlocked.has(id);
          card.classList.toggle("locked", !isUnlocked);
          card.classList.toggle("vr-selected", id === selected);
        });
      }

      // Popup helpers
      let pendingUniverseId = null;

      function showBuyError(msg){
        if (!buyError) return;
        buyError.textContent = msg || "";
        buyError.classList.toggle("show", !!msg);
      }

      function currentCoins300Price() {
        const p = window.VRIAP?.getPrice?.(SKU_COINS_300) || "";
        return p ? (" (" + p + ")") : "";
      }

      function openBuyPopup(universeId) {
        pendingUniverseId = universeId;

        // title = universe title (i18n)
        const titleKey = "universe." + universeId + ".title";
        buyTitle.textContent = _t(titleKey, universeId);

        // desc (i18n with {price})
        buyDesc.textContent = _t(
          "ui.universe_buy.desc",
          "Cet univers est verrouillé. Tu peux le débloquer avec {price} VCoins, ou acheter 300 VCoins sur le store.",
          { price: PRICE_VCOINS_UNLOCK }
        );

        // buttons (i18n)
        buyPay.textContent = _t(
          "ui.universe_buy.pay",
          "Débloquer pour {price} VCoins",
          { price: PRICE_VCOINS_UNLOCK }
        );

        buyIap.textContent = _t("ui.universe_buy.iap", "Acheter 300 VCoins") + currentCoins300Price();
        buyCancel.textContent = _t("ui.universe_buy.cancel", "Annuler");

        // reset
        showBuyError("");
        buyOverlay.classList.add("show");
      }

      function closeBuyPopup() {
        buyOverlay.classList.remove("show");
        pendingUniverseId = null;
        showBuyError("");
      }

      // Unlock flow with VCoins (RPC)
      async function unlockUniverseWithVCoins(universeId) {
        if (!universeId) return false;
        try {
          if (!window.VRRemoteStore?.unlockUniverse) throw new Error("unlockUniverse missing");
          const ok = await window.VRRemoteStore.unlockUniverse(universeId, PRICE_VCOINS_UNLOCK);
          if (!ok) return false;

          // update local unlocked set
          const unlocked = getUnlockedSet();
          unlocked.add(universeId);
          setUnlockedSet(unlocked);

          // select & refresh ui
          setSelectedUniverse(universeId);
          updateUniverseLocks();
          return true;
        } catch (e) {
          return false;
        }
      }

      // Buy coins via Play Store then auto unlock with VCoins
      async function buyCoins300ThenUnlock(universeId){
        if (!universeId) return;

        // Store only available in App (Capacitor + IAP plugin)
        const isIapAvailable = !!window.VRIAP?.isAvailable?.();
        if (!isIapAvailable){
          showBuyError(_t("ui.universe_buy.err_app_only", "Achat Play Store dispo uniquement dans l’app."));
          return;
        }

        // remember target universe, then purchase product
        try { localStorage.setItem(IAP_TARGET_KEY, universeId); } catch(e){}

        try {
          const ok = await window.VRIAP.buy?.(SKU_COINS_300);
          if (!ok){
            showBuyError(_t("ui.universe_buy.err_buy_failed", "Achat annulé ou impossible."));
            return;
          }
          // success purchase -> credit event should fire (vr:iap_credited), then we'll auto-unlock there.
          showBuyError(""); // clear
        } catch(e){
          showBuyError(_t("ui.universe_buy.err_iap_not_ready", "Système d’achat non prêt."));
        }
      }

      // Handle clicking outside popup
      buyOverlay.addEventListener("click", (e)=>{
        if (e.target === buyOverlay) closeBuyPopup();
      });
      document.addEventListener("keydown", (e)=>{
        if (e.key === "Escape" && buyOverlay.classList.contains("show")) closeBuyPopup();
      });

      // Button events
      buyCancel.addEventListener("click", closeBuyPopup);

      buyPay.addEventListener("click", async () => {
        showBuyError("");
        buyPay.disabled = true;
        buyIap.disabled = true;

        const ok = await unlockUniverseWithVCoins(pendingUniverseId);
        if (ok){
          closeBuyPopup();
        } else {
          showBuyError(_t("ui.universe_buy.err_unlock", "Impossible de débloquer (VCoins insuffisants ou erreur réseau)."));
        }

        buyPay.disabled = false;
        buyIap.disabled = false;
      });

      buyIap.addEventListener("click", async () => {
        showBuyError("");
        buyPay.disabled = true;
        buyIap.disabled = true;

        await buyCoins300ThenUnlock(pendingUniverseId);

        buyPay.disabled = false;
        buyIap.disabled = false;
      });

      // Update price live when purchases.js emits vr:iap_price
      window.addEventListener("vr:iap_price", (ev)=>{
        const d = ev?.detail || {};
        if (d.productId === SKU_COINS_300){
          buyIap.textContent = _t("ui.universe_buy.iap", "Acheter 300 VCoins") + currentCoins300Price();
        }
      });

      // After coins credited, auto-unlock the stored target universe
      window.addEventListener("vr:iap_credited", async (ev)=>{
        try {
          const d = ev?.detail || {};
          if (d.productId !== SKU_COINS_300) return;

          const target = localStorage.getItem(IAP_TARGET_KEY) || "";
          if (!target) return;

          // refresh user coins from server if possible
          try { await window.VRRemoteStore?.refreshMe?.(); } catch(e){}

          // try unlock
          const ok = await unlockUniverseWithVCoins(target);

          // clear target regardless (avoid loops)
          try { localStorage.removeItem(IAP_TARGET_KEY); } catch(e){}

          if (!ok){
            // If popup is open, show error
            if (buyOverlay.classList.contains("show")){
              showBuyError(_t("ui.universe_buy.err_unlock_after_buy", "Achat ok, mais déblocage impossible. Réessaie plus tard."));
            }
          } else {
            // close popup if it was open
            if (buyOverlay.classList.contains("show")) closeBuyPopup();
          }
        } catch(e){}
      });

      // Card click -> select or open popup if locked
      cards.forEach(card=>{
        card.addEventListener("click", (e)=>{
          const id = card.getAttribute("data-universe");
          if (!id) return;

          // ignore clicks on info button (handled by tooltip)
          if (e.target.closest(".vr-info-btn")) return;

          const unlocked = getUnlockedSet();
          if (!unlocked.has(id)){
            openBuyPopup(id);
            return;
          }

          setSelectedUniverse(id);
          updateUniverseLocks();
        });
      });

      // Init
      updateUniverseLocks();
    })();
  </script>

  <script>
    // =====================================================================
    // USERNAME POPUP (si pas de pseudo)
    // =====================================================================
    (function () {
      "use strict";

      const overlay = document.getElementById("vr-usr-overlay");
      const titleEl = document.getElementById("vr-usr-title");
      const subEl = document.getElementById("vr-usr-sub");
      const inputEl = document.getElementById("vr-usr-input");
      const hintEl = document.getElementById("vr-usr-hint");
      const btnSave = document.getElementById("vr-usr-save");
      const btnSkip = document.getElementById("vr-usr-skip");
      const errEl = document.getElementById("vr-usr-err");

      function showErr(msg){
        errEl.textContent = msg || "";
        errEl.classList.toggle("show", !!msg);
      }

      function open(){
        titleEl.textContent = _t("auth.username.title", "Choisis ton pseudo");
        subEl.textContent = _t("auth.username.subtitle", "Il sera visible dans l’app.");
        inputEl.placeholder = _t("auth.username.placeholder", "Ex: Lucifer_7");
        hintEl.textContent = _t("auth.username.rules", "3 à 20 caractères • lettres/chiffres/_/-");
        btnSave.textContent = _t("auth.username.cta", "Valider");
        btnSkip.textContent = _t("auth.username.skip", "Plus tard");
        showErr("");
        overlay.classList.add("show");
        setTimeout(()=>inputEl.focus(), 120);
      }

      function close(){
        overlay.classList.remove("show");
        showErr("");
      }

      function validName(name){
        if (!name) return false;
        if (name.length < 3 || name.length > 20) return false;
        return /^[a-zA-Z0-9_-]+$/.test(name);
      }

      btnSkip.addEventListener("click", close);
      overlay.addEventListener("click", (e)=>{ if (e.target === overlay) close(); });
      document.addEventListener("keydown", (e)=>{ if (e.key === "Escape" && overlay.classList.contains("show")) close(); });

      btnSave.addEventListener("click", async ()=>{
        const raw = (inputEl.value || "").trim();
        showErr("");

        if (raw.length < 3 || raw.length > 20){
          showErr(_t("auth.username.errors.length", "Le pseudo doit faire entre 3 et 20 caractères."));
          return;
        }
        if (!/^[a-zA-Z0-9_-]+$/.test(raw)){
          showErr(_t("auth.username.errors.chars", "Utilise seulement lettres, chiffres, _ ou -."));
          return;
        }

        btnSave.disabled = true;
        btnSkip.disabled = true;

        try{
          const ok = await window.VRRemoteStore?.setUsername?.(raw);
          if (ok){
            close();
          } else {
            showErr(_t("auth.username.errors.taken", "Ce pseudo est déjà pris, essaie-en un autre."));
          }
        } catch(e){
          showErr(_t("auth.username.errors.generic", "Impossible d’enregistrer le pseudo."));
        }

        btnSave.disabled = false;
        btnSkip.disabled = false;
      });

      // open only if username missing (server authoritative)
      (async function init(){
        try{
          const me = await window.VRRemoteStore?.getMe?.();
          const uname = me?.username || "";
          if (!uname) open();
        } catch(e){
          // if cannot fetch, do nothing (avoid blocking)
        }
      })();
    })();
  </script>
